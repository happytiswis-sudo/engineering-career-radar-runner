name: RETIRED — Extension pairing-code provisioning
# Retired 2026-11-15: the extension no longer uses visible or hidden pairing codes.
# Authentication now reuses the already-unlocked Career Radar dashboard editor session.
# Keep this tombstone so the obsolete provisioning workflow cannot be dispatched.
on:
  workflow_dispatch:
    inputs:
      retired_notice:
        description: "Retired. Use the dashboard-mediated extension connection."
        required: false
        type: boolean
permissions:
  contents: read
jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Retired. Pairing-code provisioning is no longer part of the extension."

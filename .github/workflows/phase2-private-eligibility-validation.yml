name: Phase 2 private eligibility validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-private-eligibility-validation.yml

permissions:
  contents: read

jobs:
  private-source-regression:
    uses: ./.github/workflows/private-scanner-regression.yml
    with:
      private_ref: 443e5f44eb99d72f86b883249163f3a253b610aa
      private_base_ref: main
    secrets: inherit

# Re-run against the latest degree/seniority corrections.

# Re-run after correcting the regex escaping and adding a manager-title diagnostic.

# Re-run with corrected shared gate integration.

# Re-run after fixing senior-title word boundaries and prerequisite phrasing.

# Re-run after fixing seniority evidence ordering and prerequisite phrase.

# Re-run after restoring seniority evidence ordering.

  eligibility-import-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: happytiswis-sudo/engineering-career-radar
          ref: 443e5f44eb99d72f86b883249163f3a253b610aa
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Diagnose private module import without source disclosure
        working-directory: private-source
        run: |
          python - <<'PY'
          import ast
          import importlib
          import traceback
          from pathlib import Path
          for name in ("eligibility.py", "radar.py"):
              try:
                  ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
                  print(f"AST_OK {name}")
              except SyntaxError as exc:
                  print(f"AST_ERROR {name}:{exc.lineno} {exc.msg}")
          try:
              importlib.import_module("radar")
              print("IMPORT_OK radar")
          except Exception as exc:
              frames = traceback.extract_tb(exc.__traceback__)
              last = frames[-1] if frames else None
              print(f"IMPORT_ERROR {type(exc).__name__}: {exc}")
              if last:
                  print(f"LOCATION {last.filename}:{last.lineno}")
              raise
          PY

# Re-run after removing the stray radar module header fragment.

# Align import diagnostic checkout with the latest candidate revision.

# Re-run against expanded real-description false-negative coverage.

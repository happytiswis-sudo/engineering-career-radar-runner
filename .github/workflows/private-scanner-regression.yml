name: Private scanner regression (manual, non-publishing)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/private-scanner-regression.yml
  workflow_dispatch:
    inputs:
      private_ref:
        description: "Private retrieval branch or immutable commit to validate"
        required: false
        type: string
        default: "codex/retrieval-yield-diagnostics-v1"
      private_base_ref:
        description: "Private base branch to merge into the candidate for an isolated integration test"
        required: false
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: private-scanner-regression
  cancel-in-progress: false

jobs:
  full-private-suite:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public trial
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate requested private refs
        id: private-refs
        shell: bash
        env:
          PRIVATE_REF: ${{ inputs.private_ref }}
          PRIVATE_BASE_REF: ${{ inputs.private_base_ref }}
        run: |
          set -euo pipefail
          candidate="${PRIVATE_REF:-codex/retrieval-yield-diagnostics-v1}"
          base="${PRIVATE_BASE_REF:-main}"
          for ref in "$candidate" "$base"; do
            if [[ ! "$ref" =~ ^[A-Za-z0-9._/-]{1,160}$ ]] || [[ "$ref" == -* ]] || [[ "$ref" == *".."* ]] || [[ "$ref" == *"//"* ]]; then
              echo "Invalid private ref; use a branch, tag, or full commit SHA." >&2
              exit 2
            fi
          done
          printf 'candidate=%s\nbase=%s\n' "$candidate" "$base" >> "$GITHUB_OUTPUT"
          echo "Candidate: $candidate"
          echo "Base: $base"

      - name: Checkout private retrieval candidate (read-only token)
        uses: actions/checkout@v4
        with:
          repository: happytiswis-sudo/engineering-career-radar
          ref: ${{ steps.private-refs.outputs.candidate }}
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: true
          clean: true
          fetch-depth: 0

      - name: Merge current private base into candidate in runner workspace only
        shell: bash
        env:
          PRIVATE_BASE_REF: ${{ steps.private-refs.outputs.base }}
        run: |
          set -euo pipefail
          cd private-source
          candidate_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$PRIVATE_BASE_REF"
          base_sha="$(git rev-parse FETCH_HEAD)"
          echo "Candidate SHA: $candidate_sha"
          echo "Base SHA: $base_sha"
          if ! merge_base="$(git merge-base "$candidate_sha" "$base_sha")"; then
            echo "::error::Unable to find a common ancestor even after fetching full history."
            git log --oneline --decorate --graph -12 || true
            exit 1
          fi
          echo "Merge base: $merge_base"
          git config --local user.name "Career Radar CI"
          git config --local user.email "career-radar-ci@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          merge_status=$?
          set -e
          if [[ "$merge_status" -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Merge reported conflicts (exit $merge_status):"
            printf '%s\n' "$conflicts"
            # radar.py was manually reconciled on the candidate branch: its
            # Germany radius/coverage additions from current main were preserved
            # alongside retrieval allocation and identity telemetry. Git's
            # textual merge still sees overlapping edits, so retain that
            # reviewed combined candidate file. Never auto-resolve other paths.
            if [[ "$conflicts" == "radar.py" ]]; then
              git checkout --ours -- radar.py
              git add radar.py
              remaining="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$remaining" ]]; then
                echo "Unexpected additional conflicts after radar.py resolution:"
                printf '%s\n' "$remaining"
                git merge --abort || true
                exit 1
              fi
              echo "Resolved radar.py using the explicitly reconciled candidate version."
            else
              git status --short || true
              git merge --abort || true
              exit "$merge_status"
            fi
          fi
          echo "Clean three-way merge; tests will run against this merged working tree."
          echo "## Isolated integration merge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate SHA: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base SHA: $base_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge base: $merge_base" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: clean merge in ephemeral runner workspace; no branch pushed." >> "$GITHUB_STEP_SUMMARY"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Check reconciled integration diff
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          git diff --check
          echo "Reconciled candidate and current main are whitespace-clean." >> "$GITHUB_STEP_SUMMARY"

      - name: Run private full Python suite without printing private test output
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          python - <<'PY'
          import contextlib, io, json, unittest, sys
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          stream = io.StringIO()
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              result = unittest.TextTestRunner(stream=stream, verbosity=0).run(suite)
          summary = {
              'tests_run': result.testsRun,
              'failures': len(result.failures),
              'errors': len(result.errors),
              'skipped': len(result.skipped),
              'successful': result.wasSuccessful(),
          }
          print(json.dumps(summary, sort_keys=True))
          if not result.wasSuccessful():
              for test, _ in result.failures + result.errors:
                  print('FAILED_TEST=' + test.id())
              sys.exit(1)
          PY

      - name: Run private frontend syntax and contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          node --check public/ui-v2.js
          node --check public/frontend-v3.js
          node --check public/roles-manager.js
          node tests/frontend_v3_contract.test.js
          node tests/dashboard_navigation_wiring.test.js
          node tests/application_auth_browser.test.js
          node tests/applications_kanban_contract.test.js

      - name: Run public retrieval-engine regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf private-source

name: Private scanner regression and extension package validation (non-publishing) # [scan39-ai-coverage-telemetry-personio] # [cloro-ai-diagnostics-postmerge] verify exact merged private main # [cloro-ai-diagnostics] source candidate regression # [cloro-ai-diagnostics] validate private scanner diagnostic hardening # [extension-audit] verify dashboard inline extension handoff after WAF smoke
# Revalidate current private main after explicit deployment trigger contract updates
# Re-run exact main after dashboard and popup deletion batch limits were added
# Exact merged-main v0.1.6 release validation after dashboard lock CSS cleanup
# Revalidate latest private feature-branch head after final dashboard event wiring
# [stage1-final-score-funnel] exact frozen Stage 1 candidate regression
# [stage1-final-score-funnel] rerun after embedded frontend parity correction; candidate be0da4c450334b6f2ffc19a7974f8cf226fc7ceb
# [stage1-final-score-funnel] final rerun after default-sort and evidence-ratio review fixes; candidate 1d5f19b03e0716f34aa62c598e0e40edfabf3b66
# Retry extension results candidate after correcting stale search-password CSS copy
# [extension-release-final] Validate exact merged main after PRs 147 and 148
# Revalidate v0.1.12 extension search resilience and async detail hydration (detail assertion syntax cleanup)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - AI_HANDOFF.md
      - .github/workflows/private-scanner-regression.yml
  push:
    branches:
      - main
    paths:
      # Changes to this workflow run the private candidate regression against the feature branch.
      - .github/workflows/private-scanner-regression.yml
      - .github/workflows/production-scan.yml
      - README.md
      - public_source_adapters.py
      - deep_search.py
      - retrieval_intelligence.py
      - storage_preflight.py
      - storage_guardian.py
      - tests/test_storage_preflight.py
      - tests/test_storage_guardian.py
      - tests/**
  workflow_call:
    inputs:
      private_ref:
        required: false
        type: string
        default: "main"
      private_base_ref:
        required: false
        type: string
        default: "main"
      private_fallback_ref:
        required: false
        type: string
        default: "453298f4fed0404a4c9413e3dcb787deb4062c0b"
  workflow_dispatch:
    inputs:
      private_ref:
        description: "Private retrieval branch or immutable commit to validate"
        required: false
        type: string
        default: "main"
      private_base_ref:
        description: "Private base branch to merge into the candidate for an isolated integration test"
        required: false
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  # Keep reusable regression calls from separate caller workflows independent;
  # a newer caller must never cancel another workflow's full-suite job.
  group: private-scanner-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-private-suite:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_call' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public trial
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate requested private refs
        id: private-refs
        shell: bash
        env:
          PRIVATE_REF: ${{ inputs.private_ref }}
          PRIVATE_BASE_REF: ${{ inputs.private_base_ref }}
          PRIVATE_FALLBACK_REF: ${{ inputs.private_fallback_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRIVATE_CANDIDATE_SHA: ${{ secrets.PRIVATE_CANDIDATE_VALIDATION_SHA || '' }}
          EXPECTED_PRIVATE_CANDIDATE_BRANCH: fix/tinyfish-enrichment-candidate-ranking-20261121
          EXPECTED_PRIVATE_CANDIDATE_SHA: af69343d0b9efa6a88b8501b8ac522a2989df40e
          EXPECTED_SCAN39_CANDIDATE_SHA: 60ebca1e3f061f5757905182b3bfdfd04ca50ae3
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          candidate="${PRIVATE_REF:-${PRIVATE_FALLBACK_REF:-main}}"
          if [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[cloro-ai-diagnostics-postmerge]"* ]]; then
            candidate="main"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[cloro-ai-diagnostics]"* ]]; then
            candidate="fix/scan-yield-ai-cloro-diagnostics-20261121"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[tinyfish-enrichment]"* ]]; then
            candidate="fix/tinyfish-enrichment-reliability-20261121"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[tinyfish-enrichment-rank]"* ]]; then
            candidate="fix/tinyfish-enrichment-candidate-ranking-20261121"
          # Track coverage and Personio telemetry PRs run against their exact private candidate ref; tests cover unobserved outcomes and provider-budget context.
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[track-coverage-personio]"* ]]; then
            candidate="fix/track-coverage-personio-metrics-20261122"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[tinyfish-firecrawl-candidate]"* ]]; then
            candidate="feat/tinyfish-firecrawl-retrieval-20261121"
          elif [[ "$EVENT_NAME" == "pull_request" && ( "${PR_TITLE:-}" == *"sanitized TinyFish isolated scanner failure diagnostics"* || "${PR_TITLE:-}" == *"prevent shell substitution in TinyFish failure summary"* || "${PR_TITLE:-}" == *"safe TinyFish exception metadata diagnostics"* || "${PR_TITLE:-}" == *"safe TinyFish ValueError tracepoint diagnostics"* || "${PR_TITLE:-}" == *"pass selected tracks through TinyFish SEARCH_REQUEST override"* || "${PR_TITLE:-}" == *"docs: record isolated TinyFish provider validation #10"* ) ]]; then
            candidate="main"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[provider-track-diagnostics]"* ]]; then
            candidate="fix/provider-track-diagnostics-20261125"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[provider-track-telemetry-persistence]"* ]]; then
            candidate="feat/persist-provider-track-funnels-20261125"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[scan38-telemetry-reconciliation]"* ]]; then
            candidate="fix/scan38-provider-track-telemetry-20261125"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[bilingual-track-term-rotation]"* ]]; then
            candidate="feat/bilingual-zero-yield-track-terms-20261125"
          elif [[ "$EVENT_NAME" == "pull_request" && "${PR_TITLE:-}" == *"[scan39-ai-coverage-telemetry-personio]"* ]]; then
            candidate="fix/scan39-ai-telemetry-personio-20261125"
          elif [[ "$EVENT_NAME" == "pull_request" && "$PR_TITLE" == *"[stage3-provider-postmerge]"* ]]; then
            candidate="main"
          elif [[ "$EVENT_NAME" == "pull_request" && "$PR_TITLE" == *"[stage3-provider-correction-latest-main]"* ]]; then
            candidate="fix/stage3-provider-correction-current-main-20261125"
          elif [[ "$EVENT_NAME" == "pull_request" && "$PR_TITLE" == *"[stage3-provider-correction]"* ]]; then
            candidate="fix/stage3-provider-correction-current-main-20261125"
          elif [[ "$EVENT_NAME" == "pull_request" && -z "${PRIVATE_REF:-}" ]]; then
            candidate="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -z "${PRIVATE_REF:-}" ]]; then
            if [[ "$HEAD_COMMIT_MESSAGE" == *"[r2-guardian]"* ]]; then candidate="main";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-results-workspace]"* ]]; then candidate="feat/extension-results-dashboard-autopilot-ux";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-autostart-rich-results-ux]"* ]]; then candidate="fix/extension-autostart-rich-results-ux";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-full-catalog]"* ]]; then candidate="fix/extension-full-catalog-and-application-save";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-assessment-candidate]"* ]]; then candidate="fix/extension-complete-ai-assessment";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-search-resilience]"* ]]; then candidate="fix/extension-search-ranking-and-resilient-crawl";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[candidate-bachelor-no-senior]"* ]]; then candidate="fix/bachelor-no-senior-search-preferences";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[arbeitsagentur-api-harvester]"* ]]; then candidate="feat/arbeitsagentur-api-harvester-score-filter";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[hf-space-storage-api]"* ]]; then candidate="fix/hf-space-storage-api-measurement";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[hf-account-storage-quota]"* ]]; then candidate="fix/hf-account-wide-storage-quota-v3";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-release-final]"* ]]; then candidate="main";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[cross-source-dedupe-clean]"* ]]; then candidate="feat/p1-cross-source-dedupe-clean-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[regional-source-registry]"* ]]; then candidate="feat/p1-regional-source-registry-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[world-remote-source-fix]"* ]]; then candidate="fix/f14-world-remote-source-ranking-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[f16-source-health]"* ]]; then candidate="feat/p1-f16-source-health-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[f16-source-health-rerun]"* ]]; then candidate="feat/p1-f16-source-health-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[f16-source-health-final]"* ]]; then candidate="feat/p1-f16-source-health-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[f16-source-health-final2]"* ]]; then candidate="feat/p1-f16-source-health-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[stage1-exact-candidate]"* ]]; then candidate="feat/stage1-eu-geography-regression-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[stage1-final-score-funnel]"* ]]; then candidate="feat/stage1-eu-geography-regression-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[stage2-full-detail-claim-guard]"* ]]; then candidate="feat/stage2-extension-retrieval-assessment-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[stage3-provider-postmerge]"* ]]; then candidate="main";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[stage3-provider-correction-latest-main]"* ]]; then candidate="fix/stage3-provider-correction-current-main-20261125";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[stage3-provider-correction]"* ]]; then candidate="fix/stage3-provider-correction-current-main-20261125";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[stage3-agent-router]"* ]]; then candidate="feat/stage3-agent-router-multilingual-20261124";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"provider-isolated storage preflight"* ]]; then candidate="main";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-audit]"* ]]; then candidate="fix/dashboard-inline-extension-handoff";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-receiver-fix]"* ]]; then candidate="fix/extension-dashboard-bridge-injection-fallback";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-host-permission]"* ]]; then candidate="fix/extension-explicit-dashboard-host-permission";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-bridge-diagnostics]"* ]]; then candidate="fix/extension-bridge-injection-and-permission-diagnostics";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-main-world-handoff]"* ]]; then candidate="fix/extension-main-world-dashboard-handoff";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-auto-search]"* ]]; then candidate="fix/extension-submit-search-and-auto-advance";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[extension-ingestion-ack]"* ]]; then candidate="fix/extension-pause-on-ingestion-failure";
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[opportunity-type-search]"* ]]; then candidate="feat/opportunity-type-aware-search-v2-20261120"; # Final full regression after source-provider metadata and tests.
            elif [[ "$HEAD_COMMIT_MESSAGE" == *"[cloro-ai-diagnostics]"* ]]; then candidate="fix/scan-yield-ai-cloro-diagnostics-20261121";
            else candidate="main"; fi
          fi
          base="${PRIVATE_BASE_REF:-main}"
          for ref in "$candidate" "$base"; do
            if [[ ! "$ref" =~ ^[A-Za-z0-9._/-]{1,160}$ ]] || [[ "$ref" == -* ]] || [[ "$ref" == *".."* ]] || [[ "$ref" == *"//"* ]]; then
              echo "Invalid private ref; use a branch, tag, or full commit SHA." >&2
              exit 2
            fi
          done
          printf 'candidate=%s\nbase=%s\n' "$candidate" "$base" >> "$GITHUB_OUTPUT"
          echo "Candidate: $candidate"
          echo "Base: $base"

      - name: Checkout private retrieval candidate (read-only token)
        uses: actions/checkout@v4
        with:
          repository: happytiswis-sudo/engineering-career-radar
          ref: ${{ steps.private-refs.outputs.candidate }}
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: true
          clean: true
          fetch-depth: 0

      - name: Assert exact private candidate revision
        if: steps.private-refs.outcome == 'success'
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.private-refs.outputs.candidate }}
          EXPECTED_SCAN39_CANDIDATE_SHA: 6d864f8563e2075cf79ac24a6fee7efe0083dac3
        run: |
          set -euo pipefail
          cd private-source
          expected_branch="fix/tinyfish-enrichment-candidate-ranking-20261121"
          expected_sha="af69343d0b9efa6a88b8501b8ac522a2989df40e"
          candidate_ref="${CANDIDATE_REF:?missing resolved private candidate ref}"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$candidate_ref" =~ ^[0-9a-f]{40}$ ]]; then
            expected_ref_sha="$candidate_ref"
          elif git show-ref --verify --quiet "refs/remotes/origin/$candidate_ref"; then
            expected_ref_sha="$(git rev-parse "refs/remotes/origin/$candidate_ref")"
          else
            expected_ref_sha="$(git rev-parse "${candidate_ref}^{commit}")"
          fi
          if [[ "$actual_sha" != "$expected_ref_sha" ]]; then
            echo "::error::Private checkout does not match the resolved candidate ref."
            exit 1
          fi
          if [[ "$candidate_ref" == "$expected_branch" && "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::TinyFish candidate branch does not match its pinned validation SHA."
            exit 1
          fi
          if [[ "$candidate_ref" == "fix/scan39-ai-telemetry-personio-20261125" && "$actual_sha" != "$EXPECTED_SCAN39_CANDIDATE_SHA" ]]; then
            echo "::error::Scan #39 candidate branch does not match its pinned validation SHA."
            exit 1
          fi
          echo "Private candidate ref verified: $candidate_ref $actual_sha"
      - name: Merge current private base into candidate in runner workspace only
        shell: bash
        env:
          PRIVATE_BASE_REF: ${{ steps.private-refs.outputs.base }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          cd private-source
          candidate_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$PRIVATE_BASE_REF"
          base_sha="$(git rev-parse FETCH_HEAD)"
          echo "Candidate SHA: $candidate_sha"
          echo "Base SHA: $base_sha"
          if ! merge_base="$(git merge-base "$candidate_sha" "$base_sha")"; then
            echo "::error::Unable to find a common ancestor even after fetching full history."
            git log --oneline --decorate --graph -12 || true
            exit 1
          fi
          echo "Merge base: $merge_base"
          git config --local user.name "Career Radar CI"
          git config --local user.email "career-radar-ci@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          merge_status=$?
          set -e
          if [[ "$merge_status" -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Merge reported conflicts (exit $merge_status):"
            printf '%s\n' "$conflicts"
            # These two paths are explicitly reconciled on the candidate:
            # radar.py preserves reviewed scanner behavior; AI_HANDOFF.md was
            # refreshed from current main and then extended with this audit.
            # No other conflict is auto-resolved.
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                radar.py|AI_HANDOFF.md)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  echo "Resolved $path using the explicitly reconciled candidate version."
                  ;;
                *)
                  echo "Unexpected conflict; refusing automatic resolution: $path"
                  git status --short || true
                  git merge --abort || true
                  exit "$merge_status"
                  ;;
              esac
            done <<< "$conflicts"
            remaining="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$remaining" ]]; then
              echo "Unexpected conflicts remain:"
              printf '%s\n' "$remaining"
              git merge --abort || true
              exit 1
            fi
          fi
          echo "Clean three-way merge; tests will run against this merged working tree."
          echo "## Isolated integration merge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate SHA: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base SHA: $base_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge base: $merge_base" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: clean merge in ephemeral runner workspace; no branch pushed." >> "$GITHUB_STEP_SUMMARY"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Check reconciled integration diff
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          git diff --check
          echo "Reconciled candidate and current main are whitespace-clean." >> "$GITHUB_STEP_SUMMARY"
          echo "- Tested private HEAD: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose focused TinyFish test failures (sanitized)
        if: always() && steps.private-refs.outcome == 'success'
        shell: bash
        run: |
          set +e
          cd private-source
          python - <<'PY'
          import unittest
          import sys
          import re
          sys.path.insert(0, "tests")
          from test_public_source_adapters import PublicSourceAdaptersTests
          from test_tinyfish_enrichment_candidate_rank import TinyFishCandidateRankingTests
          names = [
              (PublicSourceAdaptersTests, "test_tinyfish_partial_enrichment_preserves_success_and_failure_metrics"),
              (PublicSourceAdaptersTests, "test_tinyfish_page_not_found_uses_next_candidate_within_budget"),
              (TinyFishCandidateRankingTests, "test_refills_after_page_not_found_without_scraping_missing_target"),
              (TinyFishCandidateRankingTests, "test_still_respects_global_six_url_cap_across_boards"),
          ]
          suite = unittest.TestSuite(cls(name) for cls, name in names)
          result = unittest.TestResult()
          suite.run(result)
          for case, err in result.failures + result.errors:
              lines = err.splitlines()
              print("TEST_FAILURE=" + case.id())
              for line in lines[-5:]:
                  print("DETAIL=" + line[:400])
          print("DIAGNOSTIC_COUNTS failures=%d errors=%d" % (len(result.failures), len(result.errors)))
          PY
          exit 0

      - name: Run private full Python suite without printing private test output
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          python - <<'PY'
          import contextlib, io, json, unittest, sys
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          stream = io.StringIO()
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              result = unittest.TextTestRunner(stream=stream, verbosity=0).run(suite)
          summary = {
              'tests_run': result.testsRun,
              'failures': len(result.failures),
              'errors': len(result.errors),
              'skipped': len(result.skipped),
              'successful': result.wasSuccessful(),
          }
          print(json.dumps(summary, sort_keys=True))
          if not result.wasSuccessful():
              for test, _ in result.failures + result.errors:
                  print('FAILED_TEST=' + test.id())
              sys.exit(1)
          PY

      - name: Diagnose private regression failures (sanitized)
        if: failure() && steps.private-refs.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          python - <<'PY'
          import contextlib
          import io
          import os
          import re
          import traceback
          import unittest

          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          result = unittest.TestResult()
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              suite.run(result)
          for test, error in result.failures + result.errors:
              trace_lines = error.splitlines() if isinstance(error, str) else []
              frames = re.findall(r'File "([^"]+)", line (\d+), in ([^\n]+)', error) if isinstance(error, str) else []
              frame = frames[-1] if frames else None
              last_line = next((line.strip() for line in reversed(trace_lines) if line.strip()), '')
              exception_match = re.match(r'([A-Za-z_][A-Za-z0-9_.]*)', last_line)
              exception_type = exception_match.group(1) if exception_match else 'UnknownError'
              source = os.path.basename(frame[0]) if frame else 'unknown'
              line = int(frame[1]) if frame else 0
              print('SANITIZED_TEST_DIAGNOSTIC test=%s exception=%s source=%s line=%s' %
                    (test.id(), exception_type, source, line))
          print('SANITIZED_DIAGNOSTIC_COUNTS failures=%d errors=%d' %
                (len(result.failures), len(result.errors)))
          PY

      - name: Run private frontend syntax and contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          node --check public/ui-v2.js
          node --check public/frontend-v3.js
          node --check public/roles-manager.js
          node --check cloudflare/search-worker.js
          node tests/search_api_contract.test.js
          node tests/frontend_v3_contract.test.js
          node tests/dashboard_navigation_wiring.test.js
          node tests/application_auth_browser.test.js
          node tests/applications_kanban_contract.test.js
          for test_file in tests/application_prompts_v3.test.js tests/extension_discovery_filters.test.js tests/scan_history_quality_contract.test.js; do
            if [[ -f "$test_file" ]]; then
              node "$test_file"
            else
              echo "Candidate-only regression not present on this private ref: $test_file"
            fi
          done

      - name: Run extension Bridge contract, restricted RPC and Worker syntax tests
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          node --check cloudflare/search-worker.js
          node --check cloudflare/dashboard-lock-worker.js
          node --check extension/background.js
          node --check extension/arbeitsagentur-api.mjs
          node --check extension/content.js
          node --check extension/dashboard-bridge.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node tests/extension_api_contract.test.js
          node --test tests/discovery_batching.test.mjs
          node --test tests/arbeitsagentur_api.test.js
          node tests/extension_schema_contract.test.js
          echo "Extension scripts, public-key identity, durable queue, role plan, ingestion and lifecycle contracts validated."

      - name: Run public retrieval-engine regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Package tested Chrome extension candidate
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          zip -qr "$RUNNER_TEMP/career-radar-chrome-extension.zip" extension
          sha256sum "$RUNNER_TEMP/career-radar-chrome-extension.zip" | tee "$RUNNER_TEMP/career-radar-chrome-extension.sha256"
          echo "Chrome extension package created after all regression checks." >> "$GITHUB_STEP_SUMMARY"
          echo "- $(cat "$RUNNER_TEMP/career-radar-chrome-extension.sha256")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tested Chrome extension package
        uses: actions/upload-artifact@v4
        with:
          name: career-radar-chrome-extension
          path: |
            ${{ runner.temp }}/career-radar-chrome-extension.zip
            ${{ runner.temp }}/career-radar-chrome-extension.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf private-source

# [extension-autostart-rich-results-ux] Re-run candidate regression after contract-test identifier correction.


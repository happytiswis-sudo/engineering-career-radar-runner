name: Keep n8n Hugging Face Space awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-n8n-space-awake
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake/check private n8n Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          N8N_SPACE_URL: ${{ vars.N8N_SPACE_URL }}
        run: |
          python - <<'PY'
          import os, sys, time, urllib.request, urllib.error
          token = os.environ.get("HF_TOKEN", "").strip()
          base = os.environ.get("N8N_SPACE_URL", "").strip().rstrip("/")
          if not token or not base:
              print("Configure HF_TOKEN secret and N8N_SPACE_URL repository variable first.")
              sys.exit(1)
          if not base.startswith("https://") or ".hf.space" not in base:
              print("N8N_SPACE_URL must be the HTTPS app URL ending in .hf.space.")
              sys.exit(1)
          url = base + "/healthz"
          for attempt in range(1, 7):
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "User-Agent": "CareerRadar-n8n-keepalive/1.0",
                  "Accept": "application/json"
              })
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      print("n8n Space health endpoint returned HTTP " + str(response.status))
                      sys.exit(0 if response.status == 200 else 1)
              except urllib.error.HTTPError as exc:
                  print("Health attempt " + str(attempt) + " returned HTTP " + str(exc.code))
                  if exc.code in (401, 403, 404):
                      sys.exit(1)
              except Exception as exc:
                  print("Health attempt " + str(attempt) + " unavailable: " + type(exc).__name__)
              if attempt < 6:
                  time.sleep(60)
          print("Space did not become healthy within the retry window.")
          sys.exit(1)
          PY

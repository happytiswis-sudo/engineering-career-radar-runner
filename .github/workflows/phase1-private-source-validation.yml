name: Phase 1 private source validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase1-private-source-validation.yml

permissions:
  contents: read

jobs:
  private-source-regression:
    uses: ./.github/workflows/private-scanner-regression.yml
    with:
      private_ref: feat/extension-quick-standard-full-api-first-20261123
      private_base_ref: main
    secrets: inherit


name: Migrate Space history archives to R2
on:
  # Every migration-code change gets a real read-only integrity dry-run.
  push:
    branches:
      - main
    paths:
      - scripts/migrate_space_history_to_r2.py
      - .github/workflows/migrate-space-history-to-r2.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate all indexed archives without writing to R2"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: career-radar-space-history-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration dependency
        run: python -m pip install "huggingface_hub>=0.30,<2"
      - name: Refresh account-wide R2 free-tier admission
        id: r2-guardian
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run != true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[r2-migrate-live]')) }}
        env:
          R2_GUARD_API_TOKEN: ${{ secrets.R2_GUARD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_CI_TOKEN: ${{ secrets.ARCHIVE_CI_TOKEN }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          BRIDGE_URL: ${{ vars.CARE_RADAR_BRIDGE_URL || 'https://career-radar-bridge.happytiswis.workers.dev' }}
        run: python scripts/r2_free_tier_guard.py
      - name: Validate and migrate immutable Space archives
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          BRIDGE_URL: ${{ vars.CARE_RADAR_BRIDGE_URL || 'https://career-radar-bridge.happytiswis.workers.dev' }}
          ARCHIVE_CI_TOKEN: ${{ secrets.ARCHIVE_CI_TOKEN }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          elif [[ "${{ github.event.head_commit.message }}" != *"[r2-migrate-live]"* ]]; then
            args+=(--dry-run)
          fi
          python scripts/migrate_space_history_to_r2.py "${args[@]}"

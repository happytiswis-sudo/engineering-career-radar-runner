name: Migrate Space history archives to R2
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate all indexed archives without writing to R2"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: career-radar-space-history-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install migration dependency
        run: python -m pip install "huggingface_hub>=0.30,<2"
      - name: Validate and migrate immutable Space archives
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          BRIDGE_URL: ${{ vars.CARE_RADAR_BRIDGE_URL || 'https://career-radar-bridge.happytiswis.workers.dev' }}
          ARCHIVE_CI_TOKEN: ${{ secrets.ARCHIVE_CI_TOKEN }}
        run: |
          args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          python scripts/migrate_space_history_to_r2.py "${args[@]}"

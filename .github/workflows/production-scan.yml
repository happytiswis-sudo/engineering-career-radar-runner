name: Career Radar production scan (private source, public runner)
run-name: Career Radar scan — ${{ github.event_name }}

on:
  workflow_dispatch:
    inputs:
      search_request:
        description: "Validated dashboard search profile as JSON (blank = scheduled defaults)"
        required: false
        type: string
      enable_production_publish:
        description: "Explicitly authorize writes to Hugging Face, Supabase and R2 (leave false for dry-run)"
        required: true
        default: false
        type: boolean
      enable_private_archive:
        description: "Store the full scan archive in private R2 only (no dashboard or vacancy publication)"
        required: false
        default: false
        type: boolean
      enable_private_telemetry:
        description: "Persist aggregate-only verified scan telemetry to private Supabase (no vacancy rows)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 7 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: career-radar-production-scan
  cancel-in-progress: false
jobs:
  scan-score-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: private-source
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout private scanner source (read-only token)
        uses: actions/checkout@v5
        with:
          repository: happytiswis-sudo/engineering-career-radar
          ref: main
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          clean: true
      - name: Verify private source checkout and CV boundary
        id: private-source
        shell: bash
        run: |
          set -euo pipefail
          test -s private/master_cv.md
          source_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Private source commit: $source_sha"
          echo "Master CV is present only in the ephemeral private-source checkout."
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify publication credentials before any production write
        if: ${{ vars.CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH == 'true' && inputs.enable_production_publish == true }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          ARCHIVE_CI_TOKEN: ${{ secrets.ARCHIVE_CI_TOKEN }}
        run: |
          set -euo pipefail
          for name in HF_TOKEN HF_SPACE_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DASHBOARD_API_KEY ARCHIVE_CI_TOKEN; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Production publishing enabled but required setting $name is missing from the public runner repository."; exit 1; fi
          done
          echo "Required production publishing credentials are present (values not displayed)."
      - name: Verify CV and matching engine
        run: |
          test -s private/master_cv.md
          python -m unittest discover -s tests -v
      - name: Synchronize role catalog for published title reference
        run: cp role_catalog.json public/role_catalog.json
      - name: Install private-Hub read client
        run: pip install 'huggingface_hub>=0.30,<2'
      - name: Restore previous aggregate source-yield artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p private "$RUNNER_TEMP/career-radar-prior-yield"
          prior_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow production-scan.yml --status success --limit 20 --json databaseId --jq '.[].databaseId')"
          restored=false
          while IFS= read -r prior_run; do
            [[ -n "$prior_run" ]] || continue
            rm -f "$RUNNER_TEMP/career-radar-prior-yield/source-yield-history.json"
            if gh run download "$prior_run" --name career-radar-source-yield --dir "$RUNNER_TEMP/career-radar-prior-yield" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 &&
               [[ -s "$RUNNER_TEMP/career-radar-prior-yield/source-yield-history.json" ]]; then
              cp "$RUNNER_TEMP/career-radar-prior-yield/source-yield-history.json" private/previous_metrics_bundle.json
              echo "Previous aggregate retrieval telemetry restored from run $prior_run."
              restored=true
              break
            fi
          done <<< "$prior_runs"
          if [[ "$restored" != true ]]; then
            echo "No prior successful scan contained the aggregate source-yield artifact; baseline allocation will be used."
          fi
      - name: Load private or aggregate historical retrieval metrics
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          token=os.environ.get('HF_TOKEN')
          space=os.environ.get('HF_SPACE_ID')
          data=None
          if token and space:
              from huggingface_hub import hf_hub_download
              try:
                  prior=hf_hub_download(repo_id=space,filename='seen-jobs.json',
                                         repo_type='space',token=token)
                  Path('private/seen-jobs.json').write_bytes(Path(prior).read_bytes())
                  print('Private historical identity hashes loaded for novelty review.')
              except Exception as exc:
                  print('Private novelty registry unavailable ('+type(exc).__name__+').')
              try:
                  prior=hf_hub_download(repo_id=space,filename='jobs.json',
                                         repo_type='space',token=token)
                  data=json.loads(Path(prior).read_text(encoding='utf8'))
                  print('Private scan history loaded for adaptive retrieval.')
              except Exception as exc:
                  print('Private scan metrics unavailable ('+type(exc).__name__+'); using aggregate telemetry fallback.')
          else:
              print('HF_TOKEN/HF_SPACE_ID are not configured; private novelty history is unavailable.')
          bundle=Path('private/previous_metrics_bundle.json')
          if data is None and bundle.is_file():
              try:
                  data=json.loads(bundle.read_text(encoding='utf8'))
                  print('Loaded safe aggregate retrieval metrics from the previous Actions artifact.')
              except Exception as exc:
                  print('Previous aggregate metrics artifact is invalid ('+type(exc).__name__+').')
          if isinstance(data,dict):
              yield_report=data.get('source_yield_report') or []
              prior_yield={str(row.get('source') or ''):{
                  'attempted_queries':int(row.get('attempted_units') or 0),
                  'completed_queries':int(row.get('successful_units') or 0),
                  'provider_rows':int(row.get('raw_urls_encountered') or 0),
                  'unique_postings':int(row.get('unique_postings',row.get('unique_canonical_urls')) or 0),
                  'unique_canonical_urls':int(row.get('unique_canonical_urls') or 0),
                  'errors':int(row.get('errors') or 0)}
                  for row in yield_report[:100]
                  if isinstance(row,dict) and row.get('source')}
              if prior_yield:
                  env_file=os.environ.get('GITHUB_ENV')
                  if env_file:
                      with open(env_file,'a',encoding='utf8') as out:
                          out.write('CAREER_RADAR_SOURCE_YIELD_JSON='+json.dumps(
                              prior_yield,separators=(',',':'))+'\n')
                  Path('private/previous_source_yield.json').write_text(
                      json.dumps(prior_yield,separators=(',',':')),encoding='utf8')
                  print('Loaded historical canonical URL yield for '+str(len(prior_yield))+
                        ' source families into adaptive capacity planning.')
              boards=data.get('source_board_metrics') or []
              safe_boards=[]
              for row in boards[:600]:
                  if not isinstance(row,dict):
                      continue
                  safe_boards.append({key:row.get(key) for key in (
                      'type','slug','raw_postings','unique_canonical_urls',
                      'usable_job_postings','errors','consecutive_zero_yield_runs',
                      'health_observation','health_last_run_id') if key in row})
              if safe_boards:
                  Path('private/previous_board_metrics.json').write_text(
                      json.dumps({'source_board_metrics':safe_boards},separators=(',',':')),encoding='utf8')
                  print('Loaded '+str(len(safe_boards))+' historical ATS board yield observations.')
              if token and space and data.get('source_query_metrics'):
                  Path('private/previous_source_metrics.json').write_text(
                      json.dumps({'source_query_metrics':data['source_query_metrics'][:400]}),
                      encoding='utf8')
              if token and space:
                  failed=data.get('board_failure_state') or {}
                  if isinstance(failed,dict) and failed:
                      Path('private/previous_board_failure_state.json').write_text(
                          json.dumps(failed),encoding='utf8')
                  try:
                      from huggingface_hub import hf_hub_download
                      source=hf_hub_download(repo_id=space,filename='company-discovery.json',
                                             repo_type='space',token=token)
                      Path('private/company-discovery.json').write_bytes(Path(source).read_bytes())
                      print('Loaded private nationwide employer records.')
                  except Exception as exc:
                      print('Prior employer directory unavailable ('+type(exc).__name__+').')
          else:
              print('No historical aggregate source metrics available; adaptive capacity retains baseline allocations.')
          PY
      - name: Install JobSpy only when individually authorized platforms are configured
        if: ${{ vars.JOBSPY_AUTHORIZED_SITES != '' }}
        run: pip install 'python-jobspy>=1.3,<2'
      - name: Find jobs and compare against private master CV
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
          HIMALAYAS_API_KEY: ${{ secrets.HIMALAYAS_API_KEY }}
          THE_MUSE_API_KEY: ${{ secrets.THE_MUSE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          CLORO_API_KEY_1: ${{ secrets.CLORO_API_KEY_1 }}
          CLORO_API_KEY_2: ${{ secrets.CLORO_API_KEY_2 }}
          SEARXNG_BASE_URL: ${{ vars.SEARXNG_BASE_URL }}
          SEARXNG_API_TOKEN: ${{ secrets.SEARXNG_API_TOKEN }}
          LINKEDIN_RETRIEVAL_AUTHORIZED: ${{ vars.LINKEDIN_RETRIEVAL_AUTHORIZED }}
          JOBSPY_LINKEDIN_MODE: ${{ vars.JOBSPY_LINKEDIN_MODE }}
          JOBSPY_LINKEDIN_FETCH_DESCRIPTION: ${{ vars.JOBSPY_LINKEDIN_FETCH_DESCRIPTION }}
          JOBSPY_AUTHORIZED_SITES: ${{ vars.JOBSPY_AUTHORIZED_SITES }}
          JOBSPY_SCHEDULED_ENABLED: ${{ vars.JOBSPY_SCHEDULED_ENABLED }}
          JOBSPY_RESULTS_PER_QUERY: ${{ vars.JOBSPY_RESULTS_PER_QUERY }}
          JOBSPY_LINKEDIN_MAX_QUERIES_PER_RUN: ${{ vars.JOBSPY_LINKEDIN_MAX_QUERIES_PER_RUN }}
          JOBSPY_LINKEDIN_QUERY_DELAY_SECONDS: ${{ vars.JOBSPY_LINKEDIN_QUERY_DELAY_SECONDS }}
          JOBSPY_LINKEDIN_RATE_LIMIT_COOLDOWN_HOURS: ${{ vars.JOBSPY_LINKEDIN_RATE_LIMIT_COOLDOWN_HOURS }}
          JOBSPY_LINKEDIN_RESET_PAUSE: ${{ vars.JOBSPY_LINKEDIN_RESET_PAUSE }}
          CAREER_RADAR_ADAPTIVE_CAPACITY: '1'
          PINPOINT_DATE_VERIFY_LIMIT: '10'
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          NARAROUTER_PROVIDER: ${{ vars.NARAROUTER_PROVIDER }}
          NARAROUTER_MODEL: ${{ vars.NARAROUTER_MODEL }}
          SEARCH_REQUEST: ${{ inputs.search_request }}
          PYTHONUNBUFFERED: '1'
        run: |
          set +e
          python radar.py > "$RUNNER_TEMP/career-radar-scan.log" 2>&1
          scan_status=$?
          if [[ $scan_status -ne 0 ]]; then
            echo "::error::Scanner exited with status $scan_status. A redacted traceback report will be attached to this run."
            SCAN_EXIT_CODE="$scan_status" python - "$RUNNER_TEMP/career-radar-scan.log" "$GITHUB_WORKSPACE/private-source/scan-failure-sanitized.json" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          frame_re = re.compile(r'File "([^"]+)", line (\d+), in ([^\s]+)')
          frames = []
          for path, line, function in frame_re.findall(log)[-20:]:
              name = Path(path).name
              if name.endswith(".py"):
                  frames.append({"file": name, "line": int(line), "function": re.sub(r"[^A-Za-z0-9_<>.-]", "", function)[:80]})
          exception_type = "UnknownError"
          for line in reversed(log.splitlines()):
              candidate = re.match(r"^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception|Exit|Interrupt))(?::|$)", line.strip())
              if candidate:
                  exception_type = candidate.group(1).split(".")[-1][:80]
                  break
          report = {"schema_version": 1, "classification": "scanner_python_exception",
                    "exit_code": int(os.environ.get("SCAN_EXIT_CODE", "1")),
                    "exception_type": exception_type, "traceback_frames": frames,
                    "redaction": "Exception message, source lines, paths, environment, CV, search profile, job and provider data omitted."}
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("Sanitized scanner failure: " + exception_type)
          for frame in frames[-8:]: print("  {file}:{line} in {function}".format(**frame))
          PY
            exit "$scan_status"
          fi
          echo "Scanner completed; detailed provider/job logs remain private to the ephemeral runner workspace."
      - name: Preserve sanitized scanner failure report
        if: ${{ always() && hashFiles('private-source/scan-failure-sanitized.json') != '' }}
        working-directory: .
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('private-source/scan-failure-sanitized.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('## Sanitized scanner failure diagnostics\n\n')
              out.write('- Exception: `'+str(report.get('exception_type','UnknownError'))+'`\n')
              for frame in report.get('traceback_frames',[]):
                  out.write('- `{file}:{line}` in `{function}`\n'.format(**frame))
              out.write('\nRaw traceback, exception message, source lines, credentials, CV and search/job data are excluded.\n')
          print('Sanitized diagnostic report added to this run summary.')
          PY
      - name: Upload sanitized scanner failure report
        if: ${{ always() && hashFiles('private-source/scan-failure-sanitized.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: career-radar-sanitized-failure
          path: private-source/scan-failure-sanitized.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify private retrieval telemetry receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          jobs=json.loads(Path('public/jobs.json').read_text(encoding='utf8'))
          summary=json.loads(Path('private/scan-telemetry.json').read_text(encoding='utf8'))
          receipt=summary.get('telemetry_verification') or summary.get('verification') or {}
          if str(jobs.get('run_id') or '') != str(summary.get('run_id') or ''):
              raise SystemExit('Private telemetry and scanner output run IDs differ.')
          if receipt.get('verified') is not True:
              raise SystemExit('Private scan telemetry verification did not pass.')
          if int(receipt.get('unique_canonical_urls',-1)) != int((jobs.get('retrieval_funnel') or {}).get('unique_canonical_urls',-2)):
              raise SystemExit('Global canonical URL count does not reconcile.')
          print('Verified full-scan telemetry receipt is present; raw records remain in private workspace.')
          PY
      - name: Summarize privacy-safe retrieval metrics
        run: |
          python - <<'PY'
          import json,os
          data=json.load(open('public/jobs.json',encoding='utf8'))
          telemetry=json.load(open('private/scan-telemetry.json',encoding='utf8'))
          receipt=telemetry.get('telemetry_verification') or telemetry.get('verification') or {}
          funnel=data.get('retrieval_funnel') or {}
          coverage=data.get('track_coverage_report') or {}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
              f.write("## Verified privacy-safe retrieval summary\\n\\n")
              f.write(f"Raw URLs: {funnel.get('raw_urls_encountered','—')} · Global unique canonical URLs: {funnel.get('unique_canonical_urls','—')} · Usable postings: {funnel.get('usable_job_postings','—')}\\n\\n")
              f.write(f"Posting identities: {funnel.get('retrieved_vacancy_identity_count','—')} · Newly discovered: {funnel.get('newly_discovered_vacancies','unverified')} ({funnel.get('newly_discovered_vacancies_basis','no historical basis')})\\n\\n")
              f.write(f"Career tracks: {receipt.get('reported_track_count','—')}/{receipt.get('catalogue_track_count','—')} · Allocated: {receipt.get('allocated_track_count','—')} · With retrieval results: {receipt.get('tracks_with_results','—')}\\n\\n")
              f.write(f"Queries planned/attempted/succeeded/failed: {coverage.get('planned_queries',0)}/{coverage.get('attempted_queries',0)}/{coverage.get('successful_queries',0)}/{coverage.get('failed_queries',0)}\\n\\n")
              f.write(f"Scanner collected {data.get('total_collected',0)} postings and shortlisted {data.get('total_shortlisted',0)}. The public log contains aggregate counts only.\\n")
          PY
      - name: Prepare privacy-safe source-yield history artifact
        if: ${{ success() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scan_telemetry import public_aggregate_artifact, verify_scan_telemetry
          data=json.loads(Path('public/jobs.json').read_text(encoding='utf8'))
          identity=json.loads(Path('private/retrieval-identity-hashes.json').read_text(encoding='utf8'))
          receipt=verify_scan_telemetry(data,identity)
          safe=public_aggregate_artifact(data,receipt)
          raw=json.dumps(safe,separators=(',',':'),ensure_ascii=False)
          forbidden=('employer','company','job_title','description','vacancy_url','identity_hash','slug','board_url','url')
          if any(term in raw.casefold() for term in forbidden):
              raise SystemExit('Aggregate artifact contains a forbidden detail key.')
          Path('source-yield-history.json').write_text(raw,encoding='utf8')
          print('Prepared aggregate-only artifact: global funnel, provider-family yield, track counters and classification counts.')
          PY
      - name: Persist verified scan telemetry to private Supabase (aggregate only)
        if: ${{ inputs.enable_private_telemetry == true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAREER_RADAR_RUNNER_REPOSITORY: happytiswis-sudo/engineering-career-radar-runner
          PRIVATE_SOURCE_COMMIT_SHA: ${{ steps.private-source.outputs.commit_sha }}
        run: python persist_scan_telemetry.py
      - name: Retain aggregate source-yield history for adaptive allocation
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: career-radar-source-yield
          path: private-source/source-yield-history.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive scan and merge private Hugging Face history
        id: archive-history
        if: ${{ vars.CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH == 'true' && inputs.enable_production_publish == true }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          CAREER_RADAR_RUNNER_REPOSITORY: happytiswis-sudo/engineering-career-radar-runner
        run: python publish_history.py
      - name: Ensure current run archive exists locally
        if: ${{ always() && hashFiles('private-source/public/jobs.json') != '' }}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from search_history import create_snapshot
          root=Path('public')
          run_id=os.environ['GITHUB_RUN_ID']
          archive=root/'history'/('run-'+run_id+'.json')
          if archive.exists():
              doc=json.loads(archive.read_text(encoding='utf-8'))
              if str(doc.get('run_id')) != run_id or not isinstance(doc.get('jobs'),list):
                  raise SystemExit('Existing local archive is invalid; refusing to overwrite it.')
              print('Using history-enriched local archive.')
          else:
              data=json.loads((root/'jobs.json').read_text(encoding='utf-8'))
              entry,snapshot=create_snapshot(data,run_id,os.environ.get('GITHUB_EVENT_NAME','workflow_dispatch'),os.environ.get('GITHUB_RUN_ATTEMPT','1'))
              archive.parent.mkdir(parents=True,exist_ok=True)
              archive.write_text(json.dumps(snapshot,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print('Created fallback archive from completed scan output.')
          PY
      - name: Store and verify current archive in private R2
        id: upload-r2-archive
        if: ${{ always() && (inputs.enable_private_archive == true || (vars.CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH == 'true' && inputs.enable_production_publish == true)) && hashFiles(format('private-source/public/history/run-{0}.json', github.run_id)) != '' }}
        continue-on-error: ${{ inputs.enable_private_archive != true }}
        env:
          CARE_RADAR_BRIDGE_URL: ${{ vars.CARE_RADAR_BRIDGE_URL || 'https://career-radar-bridge.happytiswis.workers.dev' }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          ARCHIVE_CI_TOKEN: ${{ secrets.ARCHIVE_CI_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          bridge=os.environ.get('CARE_RADAR_BRIDGE_URL','').rstrip('/')
          dashboard_key=os.environ.get('DASHBOARD_API_KEY','').strip()
          run_id=os.environ['GITHUB_RUN_ID']
          ci_token=os.environ.get('ARCHIVE_CI_TOKEN','').strip()
          if not bridge or not ci_token or not dashboard_key:
              raise SystemExit('Private R2 archive requires CARE_RADAR_BRIDGE_URL, ARCHIVE_CI_TOKEN and DASHBOARD_API_KEY.')
          key='history/run-'+run_id+'.json'
          raw=Path('public/'+key).read_bytes()
          doc=json.loads(raw)
          if str(doc.get('run_id'))!=run_id or not isinstance(doc.get('jobs'),list):
              raise SystemExit('Archive validation failed before R2 upload.')
          digest=hashlib.sha256(raw).hexdigest()
          origin='https://career-radar-dashboard.happytiswis.workers.dev'
          headers={'X-Archive-CI-Token':os.environ.get('ARCHIVE_CI_TOKEN','').strip(),'Content-Type':'application/json','Content-Length':str(len(raw))}
          # GitHub-hosted CI's default Python User-Agent is blocked by Cloudflare's
          # workers.dev Browser Integrity Check (error 1010). Keep the same private
          # Bridge route and CI-token auth, but use a neutral application UA.
          class ArchiveTransport(urllib.request.HTTPHandler):
              def http_open(self, req):
                  return self.do_open(self.parent, req)
          opener=urllib.request.build_opener()
          def archive_request(url, data=None, method='GET'):
              request=urllib.request.Request(url,data=data,headers={
                  'X-Dashboard-Key':dashboard_key,
                  'X-Archive-CI-Token':ci_token,
                  'User-Agent':'CareerRadar-ArchivePublisher/1.0 (+https://github.com/happytiswis-sudo/engineering-career-radar)',
                  **({'Content-Type':'application/json','Content-Length':str(len(data))} if data is not None else {})
              },method=method)
              return opener.open(request,timeout=90)
          put_url=bridge+'/archives?key='+urllib.parse.quote(key,safe='')
          try:
              with archive_request(put_url,data=raw,method='PUT') as response:
                  saved=json.loads(response.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              raise SystemExit('R2 PUT failed: HTTP '+str(exc.code)+' '+exc.read(400).decode('utf-8','replace'))
          if not saved.get('stored') or int(saved.get('size') or 0)!=len(raw):
              raise SystemExit('R2 did not confirm the expected archive size.')

          try:
              with archive_request(bridge+'/archives/'+urllib.parse.quote(key,safe='/')) as response:
                  copied=response.read()
          except urllib.error.HTTPError as exc:
              raise SystemExit('R2 read-back failed: HTTP '+str(exc.code)+' '+exc.read(400).decode('utf-8','replace'))
          if len(copied)!=len(raw) or hashlib.sha256(copied).hexdigest()!=digest:
              raise SystemExit('R2 SHA-256 read-back verification failed.')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('verified=true\n')
              out.write('sha256='+digest+'\n')
              out.write('bytes='+str(len(raw))+'\n')
          print('R2 archive verified: '+key+' ('+str(len(raw))+' bytes).')
          PY
      - name: Persist completed shortlist to Supabase (primary results store)
        id: persist-supabase
        if: ${{ vars.CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH == 'true' && inputs.enable_production_publish == true && always() && hashFiles('private-source/public/jobs.json') != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CAREER_RADAR_RUNNER_REPOSITORY: happytiswis-sudo/engineering-career-radar-runner
          GITHUB_SERVER_URL: ${{ github.server_url }}
          DASHBOARD_PUBLISHED: 'false'
          RESULT_STORAGE: ${{ steps.upload-r2-archive.outcome == 'success' && 'supabase+r2' || 'supabase' }}
          ARCHIVE_STORE: ${{ steps.upload-r2-archive.outcome == 'success' && 'r2' || 'artifact-only' }}
        run: python publish_supabase_jobs.py
      - name: Refresh R2 archive after retrieval novelty reconciliation
        if: ${{ vars.CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH == 'true' && inputs.enable_production_publish == true && steps.upload-r2-archive.outcome == 'success' && hashFiles(format('private-source/public/history/run-{0}.json', github.run_id)) != '' }}
        env:
          CARE_RADAR_BRIDGE_URL: ${{ vars.CARE_RADAR_BRIDGE_URL || 'https://career-radar-bridge.happytiswis.workers.dev' }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          ARCHIVE_CI_TOKEN: ${{ secrets.ARCHIVE_CI_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          bridge=os.environ.get('CARE_RADAR_BRIDGE_URL','').rstrip('/')
          token=os.environ.get('ARCHIVE_CI_TOKEN','').strip()
          run_id=os.environ['GITHUB_RUN_ID']
          path=Path('public/history/run-'+run_id+'.json')
          raw=path.read_bytes()
          doc=json.loads(raw)
          if str(doc.get('run_id') or '')!=run_id or not isinstance(doc.get('jobs'),list):
              raise SystemExit('Reconciled archive failed run-ID validation.')
          funnel=doc.get('retrieval_funnel') or {}
          if funnel.get('newly_discovered_vacancies_basis')!='private_hash_identity_registry':
              raise SystemExit('Reconciled archive is missing the private identity novelty result.')
          if not bridge or not token:
              raise SystemExit('R2 refresh configuration is missing.')
          key='history/run-'+run_id+'.json'
          headers={'X-Dashboard-Key':os.environ.get('DASHBOARD_API_KEY','').strip(),
                   'X-Archive-CI-Token':token,
                   'User-Agent':'CareerRadar-ArchivePublisher/1.0',
                   'Content-Type':'application/json'}
          def request(url,data=None,method='GET'):
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=90) as response:
                      return response.read()
              except urllib.error.HTTPError as exc:
                  raise SystemExit('R2 reconciled archive refresh failed HTTP '+str(exc.code)+
                                   ': '+exc.read(400).decode('utf-8','replace'))
          url=bridge+'/archives?key='+urllib.parse.quote(key,safe='')
          saved=json.loads(request(url,raw,'PUT').decode('utf-8'))
          if not saved.get('stored') or int(saved.get('size') or 0)!=len(raw):
              raise SystemExit('R2 did not confirm the reconciled archive size.')
          copied=request(bridge+'/archives/'+urllib.parse.quote(key,safe='/'))
          if len(copied)!=len(raw) or hashlib.sha256(copied).hexdigest()!=hashlib.sha256(raw).hexdigest():
              raise SystemExit('R2 reconciled archive read-back SHA-256 mismatch.')
          print('Refreshed and verified R2 archive with retrieval novelty count: '+
                str(funnel.get('newly_discovered_vacancies'))+'.')
          PY
      - name: Publish dashboard only — never CV or secrets (best-effort mirror)
        id: publish-dashboard
        if: ${{ vars.CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH == 'true' && inputs.enable_production_publish == true }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ.get('HF_TOKEN')
          space=os.environ.get('HF_SPACE_ID')
          if not token or not space: raise RuntimeError('Missing HF_TOKEN secret or HF_SPACE_ID variable')
          HfApi(token=token).upload_folder(repo_id=space,repo_type='space',folder_path='public',
              allow_patterns=['README.md','index.html','jobs.json','seen-jobs.json','history/*.json','role_catalog.json','company_targets.json','employers.json','ui-v2.css','ui-v2.js','roles-manager.js','on-demand.js','local-leads.js','company_leads.json','company-discovery.json','mentor-review.json','search-history.json'])
          print('Published only public dashboard files; master CV, tokens, source config and workflow are excluded')
          PY
      - name: Verify private Space publication and history index
        if: ${{ steps.publish-dashboard.outcome == 'success' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          token=os.environ['HF_TOKEN']
          space=os.environ['HF_SPACE_ID']
          run_id=str(os.environ['GITHUB_RUN_ID'])
          if not token or not space:
              raise RuntimeError('HF_TOKEN/HF_SPACE_ID missing during publication verification')
          remote_jobs=hf_hub_download(repo_id=space,filename='jobs.json',repo_type='space',token=token)
          jobs=json.loads(Path(remote_jobs).read_text(encoding='utf-8'))
          if str(jobs.get('run_id') or '') != run_id:
              raise RuntimeError('Published jobs.json run_id does not match current GitHub run')
          if not isinstance(jobs.get('jobs'),list):
              raise RuntimeError('Published jobs.json has no jobs array')
          remote_index=hf_hub_download(repo_id=space,filename='search-history.json',repo_type='space',token=token)
          index=json.loads(Path(remote_index).read_text(encoding='utf-8'))
          entry=next((x for x in index.get('runs',[]) if str(x.get('run_id'))==run_id),None)
          if not entry or entry.get('published') is not True:
              raise RuntimeError('Current run is missing from the private Space search-history index')
          print('Verified private Space dashboard mirror: run '+run_id+
                ', current jobs='+str(len(jobs['jobs']))+
                ', index entries='+str(len(index.get('runs') or [])))
          PY


      # Email/n8n delivery intentionally disabled: scan results remain in Supabase and the private Space.
      - name: Remove private source checkout and working files
        if: always()
        working-directory: .
        shell: bash
        run: rm -rf private-source

name: Sync dashboard UI to private Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-space-ui.yml

permissions:
  contents: read

concurrency:
  group: career-radar-production-scan
  cancel-in-progress: false

jobs:
  sync-ui:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[space-ui-sync]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: private-source
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout private source (read-only token)
        uses: actions/checkout@v5
        with:
          repository: happytiswis-sudo/engineering-career-radar
          ref: main
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          clean: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Hugging Face storage client
        run: python -m pip install 'huggingface_hub>=0.30,<2'

      - name: Validate dashboard assets and contracts
        run: |
          set -euo pipefail
          node --check public/frontend-v3.js
          node --check public/ui-v2.js
          node --check public/roles-manager.js
          node tests/frontend_v3_contract.test.js
          node tests/dashboard_navigation_wiring.test.js
          node tests/application_auth_browser.test.js
          node tests/applications_kanban_contract.test.js
          test -s public/index.html
          test -s public/frontend-v3.css
          test -s public/README.md

      - name: Check account-wide Hugging Face capacity before UI writes
        id: storage-guardian-hf
        env:
          CHECK_SUPABASE_STORAGE: 'false'
          CHECK_HF_STORAGE: 'true'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_UPLOAD_ROOT: public
          STORAGE_GUARD_REPORT: hf-storage-guardian-report.json
        shell: bash
        run: |
          set -euo pipefail
          python storage_preflight.py

      - name: Publish allowlisted UI assets only
        if: ${{ steps.storage-guardian-hf.outputs.hf_write_admitted == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          space = os.environ.get("HF_SPACE_ID")
          if not token or not space:
              raise RuntimeError("Missing HF_TOKEN or HF_SPACE_ID; refusing Space upload")
          assets = (
              "README.md",
              "index.html",
              "frontend-v3.js",
              "frontend-v3.css",
              "ui-v2.js",
              "ui-v2.css",
              "roles-manager.js",
          )
          root = Path("public")
          missing = [name for name in assets if not (root / name).is_file()]
          if missing:
              raise RuntimeError("Missing required dashboard assets: " + ", ".join(missing))
          api = HfApi(token=token)
          for name in assets:
              api.upload_file(
                  path_or_fileobj=str(root / name),
                  path_in_repo=name,
                  repo_id=space,
                  repo_type="space",
                  commit_message="Sync Career Radar dashboard UI: " + name,
              )
          print("Allowlisted dashboard UI assets published. No jobs, CV, secrets, or scan history were uploaded.")
          PY

      - name: Warn when requested UI sync is blocked by Hugging Face capacity
        if: ${{ always() && (steps.storage-guardian-hf.outcome == 'failure' || (steps.storage-guardian-hf.outcome == 'success' && steps.storage-guardian-hf.outputs.hf_write_admitted != 'true')) }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('hf-storage-guardian-report.json')
          report=json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          row=next((item for item in report.get('reports',[]) if str(item.get('provider','')).startswith('huggingface')), {})
          print('::warning::UI assets were not uploaded because account-wide Hugging Face admission was not confirmed: '+
                str(row.get('write_admission') or 'measurement_failed')+
                '; private_used_bytes='+str(row.get('used_bytes'))+
                '; quota_bytes='+str(row.get('quota_bytes'))+
                '; stop_threshold_bytes='+str(row.get('stop_at_bytes'))+
                '. No Space data was deleted.')
          PY

      - name: Remove private source checkout
        if: always()
        working-directory: .
        shell: bash
        run: rm -rf private-source

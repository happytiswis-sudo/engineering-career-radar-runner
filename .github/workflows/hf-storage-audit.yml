name: Hugging Face account storage audit (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-storage-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-account-storage-audit
  cancel-in-progress: false

jobs:
  account-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Reconcile repo visibility, used storage, and bucket inventory (read-only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "huggingface_hub==1.26.0"
          python - <<'PY'
          import json
          import math
          import os
          from huggingface_hub import HfApi

          TOKEN = os.environ.get("HF_TOKEN", "")
          OWNER = "Sidmed"
          TARGET = "Sidmed/engineering-career-radar"
          PRIVATE_QUOTA = 100_000_000_000
          STOP_THRESHOLD = 80_000_000_000

          if not TOKEN:
              raise SystemExit("HF_TOKEN secret is missing; no measurement was made.")

          api = HfApi(token=TOKEN)
          identity = api.whoami()
          if not isinstance(identity, dict) or str(identity.get("name", "")).casefold() != OWNER.casefold():
              raise SystemExit("SDK whoami identity did not match Sidmed; no inventory was attempted.")

          def valid_bytes(value):
              return (
                  isinstance(value, int) and not isinstance(value, bool) and value >= 0
              ) or (
                  isinstance(value, float) and math.isfinite(value) and value >= 0 and value.is_integer()
              )

          def repo_inventory(kind, listing, detail_method):
              seen = set()
              private_bytes = public_bytes = 0
              private_count = public_count = 0
              detail_count = 0
              for item in listing:
                  repo_id = getattr(item, "id", None)
                  if not isinstance(repo_id, str) or not repo_id.startswith(OWNER + "/") or repo_id in seen:
                      raise RuntimeError(kind + " inventory has invalid owner/ID or duplicate entries")
                  seen.add(repo_id)
                  info = detail_method(repo_id=repo_id)
                  visibility = getattr(info, "private", None)
                  used = getattr(info, "used_storage", None)
                  if not isinstance(visibility, bool) or not valid_bytes(used):
                      raise RuntimeError(kind + " detail is missing valid private visibility or used_storage")
                  detail_count += 1
                  size = int(used)
                  if visibility:
                      private_count += 1
                      private_bytes += size
                  else:
                      public_count += 1
                      public_bytes += size
              if detail_count != len(listing):
                  raise RuntimeError(kind + " inventory/detail reconciliation failed")
              return {
                  "inventory_count": len(listing),
                  "detail_count": detail_count,
                  "private_count": private_count,
                  "public_count": public_count,
                  "private_bytes": private_bytes,
                  "public_bytes": public_bytes,
                  "ids": seen,
              }

          inventories = {
              "models": list(api.list_models(author=OWNER)),
              "datasets": list(api.list_datasets(author=OWNER)),
              "spaces": list(api.list_spaces(author=OWNER)),
          }
          results = {}
          results["models"] = repo_inventory("models", inventories["models"], api.model_info)
          results["datasets"] = repo_inventory("datasets", inventories["datasets"], api.dataset_info)
          results["spaces"] = repo_inventory("spaces", inventories["spaces"], api.space_info)

          # Buckets are a separate Hub resource family. Enumerate and inspect them
          # using the official SDK; do not infer that an empty listing means zero
          # unless the list call itself succeeds.
          if not hasattr(api, "list_buckets") or not hasattr(api, "bucket_info"):
              raise SystemExit("Installed huggingface_hub SDK lacks list_buckets/bucket_info; bucket coverage is unverified.")
          try:
              bucket_listing = list(api.list_buckets(namespace=OWNER))
          except Exception as exc:
              response = getattr(exc, "response", None)
              status = getattr(response, "status_code", None)
              raise SystemExit("Bucket inventory failed: " + type(exc).__name__ + " HTTP " + str(status)) from None

          bucket_seen = set()
          bucket_private_bytes = bucket_public_bytes = 0
          bucket_private_count = bucket_public_count = 0
          for bucket in bucket_listing:
              bucket_id = getattr(bucket, "id", None)
              if not isinstance(bucket_id, str) or not bucket_id.startswith(OWNER + "/") or bucket_id in bucket_seen:
                  raise SystemExit("Bucket inventory has invalid owner/ID or duplicate entries.")
              bucket_seen.add(bucket_id)
              try:
                  info = api.bucket_info(bucket_id=bucket_id)
              except Exception as exc:
                  response = getattr(exc, "response", None)
                  status = getattr(response, "status_code", None)
                  raise SystemExit("Bucket detail failed: " + type(exc).__name__ + " HTTP " + str(status)) from None
              visibility = getattr(info, "private", None)
              size = getattr(info, "size", None)
              if not isinstance(visibility, bool) or not valid_bytes(size):
                  raise SystemExit("Bucket detail is missing valid private visibility or size.")
              if visibility:
                  bucket_private_count += 1
                  bucket_private_bytes += int(size)
              else:
                  bucket_public_count += 1
                  bucket_public_bytes += int(size)

          all_repo_ids = set().union(*(entry["ids"] for entry in results.values()))
          if len(all_repo_ids) != sum(entry["inventory_count"] for entry in results.values()):
              raise SystemExit("Cross-type repository reconciliation found duplicate IDs.")
          if TARGET not in results["spaces"]["ids"]:
              raise SystemExit("Career Radar target Space is absent from the authenticated account inventory.")

          private_repo_bytes = sum(results[k]["private_bytes"] for k in results)
          public_repo_bytes = sum(results[k]["public_bytes"] for k in results)
          private_total = private_repo_bytes + bucket_private_bytes
          public_total = public_repo_bytes + bucket_public_bytes
          total_count = len(all_repo_ids) + len(bucket_seen)

          report = {
              "account": OWNER,
              "sdk_version": __import__("huggingface_hub").__version__,
              "repository_inventory": {
                  k: {key: value for key, value in v.items() if key != "ids"}
                  for k, v in results.items()
              },
              "bucket_inventory": {
                  "inventory_count": len(bucket_listing),
                  "detail_count": len(bucket_seen),
                  "private_count": bucket_private_count,
                  "public_count": bucket_public_count,
                  "private_bytes": bucket_private_bytes,
                  "public_bytes": bucket_public_bytes,
              },
              "all_resource_count": total_count,
              "private_used_bytes": private_total,
              "public_used_bytes": public_total,
              "all_resources_used_bytes": private_total + public_total,
              "free_private_quota_bytes": PRIVATE_QUOTA,
              "private_usage_percent": round(private_total * 100 / PRIVATE_QUOTA, 4),
              "private_stop_threshold_bytes": STOP_THRESHOLD,
              "remaining_before_80_percent_stop_bytes": max(0, STOP_THRESHOLD - private_total),
              "admission_at_current_usage": "blocked_capacity_guard" if private_total >= STOP_THRESHOLD else "below_stop_threshold",
              "inventory_complete_for_supported_families": True,
              "scope": "all personal models, datasets, Spaces and buckets returned by official SDK list methods",
              "no_mutations": True,
          }
          print(json.dumps(report, sort_keys=True))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("## Hugging Face account storage audit (read-only)\\n\\n")
                  stream.write(f"- Resources: {total_count} total, including {len(bucket_seen)} buckets\\n")
                  stream.write(f"- Private usage: {private_total:,} / {PRIVATE_QUOTA:,} bytes ({report['private_usage_percent']}%)\\n")
                  stream.write(f"- Public usage (separate): {public_total:,} bytes\\n")
                  stream.write(f"- All resources: {private_total + public_total:,} bytes\\n")
                  stream.write(f"- 80% stop threshold: {STOP_THRESHOLD:,} bytes\\n")
                  stream.write(f"- Admission at measured usage: **{report['admission_at_current_usage']}**\\n")
                  stream.write("- Repository and bucket inventory/detail counts reconciled. No data was changed.\\n")
          PY

name: Hugging Face account storage audit (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-storage-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-account-storage-audit
  cancel-in-progress: false

jobs:
  account-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official SDK repository detail methods (read-only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "huggingface_hub==1.26.0"
          python - <<'PY'
          import json
          import math
          import os
          from huggingface_hub import HfApi

          TOKEN = os.environ.get("HF_TOKEN", "")
          OWNER = "Sidmed"
          if not TOKEN:
              raise SystemExit("HF_TOKEN secret is missing; no API tests were run.")

          api = HfApi(token=TOKEN)
          identity = api.whoami()
          if not isinstance(identity, dict) or str(identity.get("name", "")).casefold() != OWNER.casefold():
              raise SystemExit("SDK whoami identity did not match Sidmed; no repository queries were run.")

          inventories = {
              "models": list(api.list_models(author=OWNER)),
              "datasets": list(api.list_datasets(author=OWNER)),
              "spaces": list(api.list_spaces(author=OWNER)),
          }

          # The API exposes no account-wide bucket listing in these per-type methods.
          # Do not claim full quota coverage from these three repository families.
          detail_methods = {
              "models": api.model_info,
              "datasets": api.dataset_info,
              "spaces": api.space_info,
          }
          storage_names = {
              "storage", "usedstorage", "used_storage", "size", "sizeondisk",
              "size_on_disk", "storagebytes", "storage_bytes", "repositorysize",
              "repository_size", "total_size", "totalsize",
          }

          results = {
              "identity": "Sidmed",
              "sdk_version": __import__("huggingface_hub").__version__,
              "inventory_counts": {kind: len(items) for kind, items in inventories.items()},
              "detail_methods": {},
          }

          for kind, items in inventories.items():
              method = detail_methods[kind]
              detail_ok = 0
              failures = {}
              candidate_fields = {}
              numeric_values = []
              for item in items:
                  repo_id = getattr(item, "id", None)
                  if not isinstance(repo_id, str) or not repo_id.startswith(OWNER + "/"):
                      raise SystemExit("Per-type inventory returned an unexpected repository identity.")
                  try:
                      info = method(repo_id=repo_id)
                      detail_ok += 1
                      attrs = {}
                      if hasattr(info, "__dict__"):
                          attrs.update(vars(info))
                      for name in dir(info):
                          if name.startswith("_") or name in attrs:
                              continue
                          try:
                              value = getattr(info, name)
                          except Exception:
                              continue
                          if not callable(value):
                              attrs[name] = value
                      for name, value in attrs.items():
                          normalized = name.replace("-", "_").casefold()
                          if normalized in storage_names:
                              candidate_fields[name] = candidate_fields.get(name, 0) + 1
                              if isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value) and value >= 0:
                                  numeric_values.append({"field": name, "value": int(value) if float(value).is_integer() else value})
                  except Exception as exc:
                      response = getattr(exc, "response", None)
                      status = getattr(response, "status_code", None)
                      key = type(exc).__name__ + (("_HTTP_" + str(status)) if status else "")
                      failures[key] = failures.get(key, 0) + 1

              results["detail_methods"][kind] = {
                  "method": {"models": "model_info", "datasets": "dataset_info", "spaces": "space_info"}[kind],
                  "repositories_tested": len(items),
                  "detail_successes": detail_ok,
                  "failures_by_type": failures,
                  "storage_candidate_fields_found": candidate_fields,
                  "numeric_storage_values_found": len(numeric_values),
                  # Only expose aggregate candidates, never repository IDs.
                  "candidate_numeric_values": numeric_values,
              }

          results["account_storage_measurement"] = "NOT_ESTABLISHED"
          results["reason"] = "Repository detail methods do not prove complete account coverage or bucket storage; storage candidate fields require API semantics verification."
          results["no_mutations"] = True
          print(json.dumps(results, sort_keys=True))

          if any(
              detail["detail_successes"] != detail["repositories_tested"]
              for detail in results["detail_methods"].values()
          ):
              raise SystemExit("At least one per-repository detail request failed; no account storage total may be inferred.")
          PY

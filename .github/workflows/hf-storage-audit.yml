name: Hugging Face account storage audit (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-storage-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-account-storage-audit
  cancel-in-progress: false

jobs:
  account-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare repository enumeration APIs using the same token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "huggingface_hub==1.26.0"
          python - <<'PY'
          import json
          import os
          from huggingface_hub import HfApi

          TOKEN = os.environ.get("HF_TOKEN", "")
          OWNER = "Sidmed"
          if not TOKEN:
              raise SystemExit("HF_TOKEN secret is missing; no API tests were run.")

          api = HfApi(token=TOKEN)

          try:
              identity = api.whoami()
          except Exception as exc:
              response = getattr(exc, "response", None)
              status = getattr(response, "status_code", None)
              raise SystemExit("SDK whoami failed: " + type(exc).__name__ + " HTTP " + str(status)) from None

          if not isinstance(identity, dict) or str(identity.get("name", "")).casefold() != OWNER.casefold():
              raise SystemExit("SDK whoami identity did not match Sidmed; no repository queries were run.")

          def test(name, operation):
              try:
                  items = list(operation())
                  # Report only aggregate counts and object field availability. Do not expose repository names.
                  types = {}
                  has_storage = 0
                  has_private = 0
                  for item in items:
                      kind = getattr(item, "repo_type", None) or name.removeprefix("list_").removesuffix("s")
                      types[kind] = types.get(kind, 0) + 1
                      if getattr(item, "storage", None) is not None:
                          has_storage += 1
                      if getattr(item, "private", None) is not None:
                          has_private += 1
                  return {
                      "ok": True,
                      "count": len(items),
                      "types": types,
                      "items_with_storage_field": has_storage,
                      "items_with_private_field": has_private,
                  }
              except Exception as exc:
                  response = getattr(exc, "response", None)
                  status = getattr(response, "status_code", None)
                  return {"ok": False, "exception": type(exc).__name__, "status": status}

          results = {
              "identity": "Sidmed",
              "sdk_version": __import__("huggingface_hub").__version__,
              "list_models": test("list_models", lambda: api.list_models(author=OWNER)),
              "list_datasets": test("list_datasets", lambda: api.list_datasets(author=OWNER)),
              "list_spaces": test("list_spaces", lambda: api.list_spaces(author=OWNER)),
              "list_user_repos": test("list_user_repos", lambda: api.list_user_repos()),
          }
          print(json.dumps(results, sort_keys=True))

          # Do not treat per-type listings as account-wide quota measurements.
          print(json.dumps({
              "account_storage_measurement": "NOT_ESTABLISHED",
              "reason": "Per-type listings may omit buckets and may not expose authoritative storage bytes.",
              "no_mutations": True,
          }, sort_keys=True))

          failed = [key for key in ("list_models", "list_datasets", "list_spaces") if not results[key]["ok"]]
          if failed:
              raise SystemExit("One or more per-type read-only repository enumeration calls failed: " + ", ".join(failed))
          PY

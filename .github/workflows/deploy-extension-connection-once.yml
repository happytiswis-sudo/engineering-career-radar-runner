name: One-shot deploy Career Radar extension connection

on:
  push:
    branches:
      - main
    paths:
      - .github/DEPLOY_EXTENSION_CONNECTION_FINAL

permissions:
  contents: read

concurrency:
  group: career-radar-extension-connection-final-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public runner control repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout merged private source
        uses: actions/checkout@v5
        with:
          repository: happytiswis-sudo/engineering-career-radar
          ref: main
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          clean: true

      - name: Validate merged dashboard and extension source
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/dashboard-lock-worker.js
          node --check cloudflare/search-worker.js
          node --check public/frontend-v3.js
          node tests/search_api_contract.test.js
          node tests/frontend_v3_contract.test.js
          node tests/dashboard_navigation_wiring.test.js
          node tests/extension_api_contract.test.js
          node tests/extension_schema_contract.test.js

      - name: Require Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo "Cloudflare deployment credentials are present; values are not displayed."

      - name: Deploy dashboard Worker and exact embedded asset bundle
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: private-source
          command: deploy --config wrangler.jsonc

      - name: Deploy Bridge Worker and preserve existing encrypted bindings
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: private-source/cloudflare
          command: deploy --config wrangler.bridge.jsonc

      - name: Remove private source checkout
        if: always()
        shell: bash
        run: rm -rf private-source

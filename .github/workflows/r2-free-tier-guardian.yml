name: R2 free-tier guardian
on:
  workflow_dispatch:
  schedule:
    - cron: "48 * * * *"
permissions:
  contents: read
concurrency:
  group: career-radar-r2-free-tier-guardian
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query account-wide R2 usage and publish signed admission report
        id: guardian
        env:
          R2_GUARD_API_TOKEN: ${{ secrets.R2_GUARD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_CI_TOKEN: ${{ secrets.ARCHIVE_CI_TOKEN }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          BRIDGE_URL: ${{ vars.CARE_RADAR_BRIDGE_URL || 'https://career-radar-bridge.happytiswis.workers.dev' }}
        run: python scripts/r2_free_tier_guard.py

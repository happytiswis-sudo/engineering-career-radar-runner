name: Cloro credentials preflight (no API usage)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check both Cloro account secrets without exposing values
        env:
          CLORO_API_KEY_1: ${{ secrets.CLORO_API_KEY_1 }}
          CLORO_API_KEY_2: ${{ secrets.CLORO_API_KEY_2 }}
        run: |
          set -euo pipefail
          configured=0
          if [[ -n "${CLORO_API_KEY_1:-}" ]]; then
            echo "Cloro account 1: configured"
            configured=$((configured + 1))
          else
            echo "Cloro account 1: missing from public runner Actions secrets"
          fi
          if [[ -n "${CLORO_API_KEY_2:-}" ]]; then
            echo "Cloro account 2: configured"
            configured=$((configured + 1))
          else
            echo "Cloro account 2: missing from public runner Actions secrets"
          fi
          echo "Cloro credentials configured: ${configured}/2"
          echo "No Cloro API requests were made; no credits were consumed."
          if (( configured != 2 )); then
            echo "::error::Add both CLORO_API_KEY_1 and CLORO_API_KEY_2 as Actions secrets in this public runner repository."
            exit 1
          fi

name: Public runner smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify hosted runner execution
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_OS} / ${RUNNER_ARCH}"
          python --version
          node --version
          git --version
          test -f README.md
          python - <<'PY'
          import json, pathlib, platform, sys
          assert sys.version_info >= (3, 10)
          assert platform.system() == "Linux"
          assert pathlib.Path("README.md").is_file()
          print(json.dumps({"status":"PASS","python":platform.python_version(),"platform":platform.platform()},sort_keys=True))
          PY
      - name: Test privacy-safe retrieval intelligence
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile retrieval_intelligence.py

  private-scanner-candidate:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'engineering/retrieval-intelligence-and-provider-repair' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Checkout private scanner candidate (read-only)
        uses: actions/checkout@v5
        with:
          repository: happytiswis-sudo/engineering-career-radar
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          clean: true
      - name: Compile private scanner candidate
        working-directory: private-source
        run: python -m compileall -q .
      - name: Run full private scanner test suite with sanitized output
        working-directory: private-source
        shell: bash
        run: |
          python - <<'PY'
          import contextlib, io, json, sys, unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_*.py')
          captured=io.StringIO()
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              result=unittest.TextTestRunner(stream=captured,verbosity=0).run(suite)
          summary={
              'tests_run':result.testsRun,
              'failures':len(result.failures),
              'errors':len(result.errors),
              'skipped':len(result.skipped),
              'successful':result.wasSuccessful(),
          }
          print(json.dumps(summary,sort_keys=True))
          if not result.wasSuccessful():
              for test,_ in result.failures+result.errors:
                  print('FAILED_TEST='+test.id())
              sys.exit(1)
          PY
      - name: Remove private scanner checkout
        if: always()
        working-directory: .
        run: rm -rf private-source

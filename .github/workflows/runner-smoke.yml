name: Public runner smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify runner and compile migrated Python source
        run: |
          set -euo pipefail
          python --version
          node --version
          git --version
          python -m compileall -q .
      - name: Run privacy-safe retrieval and source-adapter regression tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_retrieval_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_serpapi_google_jobs.py' -v
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests"
          python -m unittest test_public_source_adapters.PublicSourceAdaptersTests.test_serpapi_google_jobs_paginates_and_deduplicates_tracking_urls -v
          python -m unittest test_jobspy_multiplatform.JobSpyMultiPlatformTests.test_google_jobs_is_marked_unsupported_in_jobspy_and_directs_to_serpapi -v
          python -m unittest test_radar.RadarTests.test_source_diagnostics_reports_missing_keys_rate_limits_and_stale_boards -v
          python -m unittest test_radar.RadarTests.test_source_diagnostics_uses_observed_yield_without_cv_filtering -v

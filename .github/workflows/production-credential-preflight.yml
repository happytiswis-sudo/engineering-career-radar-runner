name: Production credential and publishing-gate preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-credential-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate production credentials and read-only service access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          ARCHIVE_CI_TOKEN: ${{ secrets.ARCHIVE_CI_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CARE_RADAR_BRIDGE_URL: ${{ vars.CARE_RADAR_BRIDGE_URL || 'https://career-radar-bridge.happytiswis.workers.dev' }}
          CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH: ${{ vars.CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          required = (
              "HF_TOKEN", "HF_SPACE_ID", "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY", "DASHBOARD_API_KEY",
              "ARCHIVE_CI_TOKEN", "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              print(json.dumps({"status":"FAIL","missing_settings":missing},sort_keys=True))
              sys.exit(1)

          results = {}
          def request(url, headers=None, timeout=20):
              req = urllib.request.Request(url, headers=headers or {}, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      body = response.read()
                      return response.status, body
              except urllib.error.HTTPError as exc:
                  # Do not print bodies, headers, tokens, URLs with query data, or provider diagnostics.
                  return exc.code, b""
              except Exception as exc:
                  print(json.dumps({"status":"FAIL","check":"network","error_type":type(exc).__name__}))
                  sys.exit(1)

          # Hugging Face token identity + target Space read access (GET only).
          hf_headers = {"Authorization":"Bearer "+os.environ["HF_TOKEN"],"Accept":"application/json"}
          code, body = request("https://huggingface.co/api/whoami-v2", hf_headers)
          if code != 200:
              results["huggingface_auth"] = "FAIL_HTTP_"+str(code)
          else:
              try:
                  identity = json.loads(body)
                  results["huggingface_auth"] = "PASS" if identity.get("name") else "FAIL"
              except Exception:
                  results["huggingface_auth"] = "FAIL"
          repo = urllib.parse.quote(os.environ["HF_SPACE_ID"], safe="/")
          code, body = request("https://huggingface.co/api/spaces/"+repo, hf_headers)
          results["huggingface_space_read"] = "PASS" if code == 200 else "FAIL_HTTP_"+str(code)

          # Supabase service-role key authentication against the project's read-only PostgREST root.
          sb = os.environ["SUPABASE_URL"].rstrip("/")
          sb_headers = {
              "apikey":os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              "Authorization":"Bearer "+os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              "Accept":"application/openapi+json",
          }
          code, _ = request(sb+"/rest/v1/", sb_headers)
          results["supabase_service_role_auth"] = "PASS" if code == 200 else "FAIL_HTTP_"+str(code)

          # Cloudflare token verification and read-only Worker inventory.
          cf_headers = {"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Accept":"application/json"}
          code, body = request("https://api.cloudflare.com/client/v4/user/tokens/verify", cf_headers)
          token_ok = False
          if code == 200:
              try:
                  payload=json.loads(body)
                  token_ok=bool(payload.get("success") and payload.get("result",{}).get("status")=="active")
              except Exception:
                  token_ok=False
          results["cloudflare_token"] = "PASS" if token_ok else "FAIL_HTTP_"+str(code)
          account = urllib.parse.quote(os.environ["CLOUDFLARE_ACCOUNT_ID"], safe="")
          code, body = request("https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts", cf_headers)
          workers_ok=False
          if code == 200:
              try:
                  payload=json.loads(body)
                  names={x.get("id") or x.get("name") for x in payload.get("result",[]) if isinstance(x,dict)}
                  workers_ok=payload.get("success") is True and {"career-radar-bridge","career-radar-dashboard"}.issubset(names)
              except Exception:
                  workers_ok=False
          results["cloudflare_worker_read"] = "PASS" if workers_ok else "FAIL_HTTP_"+str(code)

          # Bridge validates DASHBOARD_API_KEY and ARCHIVE_CI_TOKEN, then lists one R2 object.
          # This is a read-only R2 binding check; no object is written or changed.
          bridge=os.environ["CARE_RADAR_BRIDGE_URL"].rstrip("/")
          bridge_headers={
              "X-Dashboard-Key":os.environ["DASHBOARD_API_KEY"],
              "X-Archive-CI-Token":os.environ["ARCHIVE_CI_TOKEN"],
              "Accept":"application/json",
              "User-Agent":"CareerRadar-ProductionCredentialPreflight/1.0",
          }
          code, body = request(bridge+"/archives?limit=1", bridge_headers)
          r2_ok=False
          if code == 200:
              try:
                  payload=json.loads(body)
                  r2_ok=isinstance(payload.get("objects"),list) and "truncated" in payload
              except Exception:
                  r2_ok=False
          results["dashboard_bridge_and_r2_read"] = "PASS" if r2_ok else "FAIL_HTTP_"+str(code)

          # The publication variable must remain false/unset during preflight.
          gate=os.environ.get("CAREER_RADAR_ENABLE_PRODUCTION_PUBLISH","").strip().lower()
          results["publishing_gate"] = "SAFE_DISABLED" if gate != "true" else "WARNING_ENABLED"
          print(json.dumps({
              "status":"PASS" if all(v=="PASS" for k,v in results.items() if k!="publishing_gate") and results["publishing_gate"]=="SAFE_DISABLED" else "FAIL",
              "checks":results,
              "operation":"read-only; no scan, no writes, no deployment, no publication",
          },sort_keys=True))
          if not all(v=="PASS" for k,v in results.items() if k!="publishing_gate") or results["publishing_gate"]!="SAFE_DISABLED":
              sys.exit(1)
          PY

name: Hugging Face credentials check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-credentials-check
  cancel-in-progress: false

jobs:
  validate-huggingface-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate HF_TOKEN and Space access (read-only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("HF_TOKEN", "").strip()
          repo_id = os.environ.get("HF_SPACE_ID", "").strip()
          if not token:
              print("FAIL: HF_TOKEN secret is missing or empty")
              sys.exit(1)
          if not repo_id or "/" not in repo_id:
              print("FAIL: HF_SPACE_ID variable is missing or invalid")
              sys.exit(1)

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "User-Agent": "career-radar-hf-credentials-check",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  # Never print response bodies or request headers; they may contain sensitive data.
                  print(f"FAIL: Hugging Face returned HTTP {exc.code} for a credential/access check")
                  sys.exit(1)
              except Exception as exc:
                  print(f"FAIL: Hugging Face request failed ({type(exc).__name__})")
                  sys.exit(1)

          status, identity = get_json("https://huggingface.co/api/whoami-v2")
          if status != 200 or not isinstance(identity, dict) or not identity.get("name"):
              print("FAIL: token authentication could not be confirmed")
              sys.exit(1)

          status, space = get_json(f"https://huggingface.co/api/spaces/{repo_id}")
          if status != 200 or not isinstance(space, dict) or not space.get("id"):
              print("FAIL: token authenticated, but Space access could not be confirmed")
              sys.exit(1)

          print(json.dumps({
              "status": "PASS",
              "token_authentication": "PASS",
              "space_access": "PASS",
              "space_id": repo_id,
              "operation": "read-only; no scan or publication",
          }, sort_keys=True))
          PY

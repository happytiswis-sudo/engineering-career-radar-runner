name: Runner workflow validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      private_ref:
        description: "Private scanner branch or exact commit SHA to validate"
        required: false
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  cloro-credential-presence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify both Cloro secrets are present without exposing values
        env:
          CLORO_API_KEY_1: ${{ secrets.CLORO_API_KEY_1 }}
          CLORO_API_KEY_2: ${{ secrets.CLORO_API_KEY_2 }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -n "${CLORO_API_KEY_1:-}" ]]; then
            echo "Cloro account 1 secret: present"
          else
            echo "Cloro account 1 secret: MISSING"
            missing=$((missing + 1))
          fi
          if [[ -n "${CLORO_API_KEY_2:-}" ]]; then
            echo "Cloro account 2 secret: present"
          else
            echo "Cloro account 2 secret: MISSING"
            missing=$((missing + 1))
          fi
          if (( missing > 0 )); then
            echo "::warning::Add both keys as encrypted Actions secrets in happytiswis-sudo/engineering-career-radar-runner. Cloro stays safely inactive until a key is present."
          else
            echo "Both Cloro credentials are present."
          fi
          echo "No Cloro API requests were made."

  cloro-private-candidate-regression:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/private-scanner-regression.yml
    with:
      private_ref: ${{ contains(github.event.pull_request.title, '[tinyfish-firecrawl-candidate]') && 'feat/tinyfish-firecrawl-retrieval-20261121' || (contains(github.event.pull_request.title, 'docs: record isolated TinyFish provider validation #10') || contains(github.event.pull_request.title, 'sanitized TinyFish isolated scanner failure diagnostics') || contains(github.event.pull_request.title, 'prevent shell substitution in TinyFish failure summary') || contains(github.event.pull_request.title, 'safe TinyFish exception metadata diagnostics') || contains(github.event.pull_request.title, 'safe TinyFish ValueError tracepoint diagnostics') || contains(github.event.pull_request.title, 'pass selected tracks through TinyFish SEARCH_REQUEST override')) && 'main' || '453298f4fed0404a4c9413e3dcb787deb4062c0b' }}
      private_base_ref: main
    secrets: inherit

  private-candidate-regression:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    uses: ./.github/workflows/private-scanner-regression.yml
    with:
      private_ref: ${{ inputs.private_ref }}
      private_base_ref: main
    secrets: inherit

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner control repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Parse workflow YAML and assert safe telemetry steps
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('.github/workflows/production-scan.yml')
          workflow=yaml.load(path.read_text(encoding='utf8'),Loader=yaml.BaseLoader)
          assert isinstance(workflow,dict) and isinstance(workflow.get('jobs'),dict)
          steps=workflow['jobs']['scan-score-publish']['steps']
          names=[step.get('name','') for step in steps]
          assert 'Restore previous aggregate source-yield artifact' in names
          assert 'Load private or aggregate historical retrieval metrics' in names
          assert 'Prepare privacy-safe source-yield history artifact' in names
          assert 'Retain aggregate source-yield history for adaptive allocation' in names
          scanner=next(step for step in steps if step.get('name')=='Find jobs and compare against private master CV')
          assert 'CAREER_RADAR_SOURCE_YIELD_JSON' not in scanner.get('env',{})
          print('Workflow YAML valid; prior metrics load before scan; aggregate artifact contains no vacancy payloads.')
          scanner = next(step for step in steps if step.get('name') == 'Find jobs and compare against private master CV')
          assert scanner.get('id') == 'scan'
          publisher = next(step for step in steps if step.get('name') == 'Persist completed shortlist to Supabase (primary results store)')
          gate = publisher.get('if', '')
          assert "steps.scan.outcome == 'success'" in gate
          assert "hashFiles('private-source/public/jobs.json') != ''" in gate
          assert "hashFiles('private-source/private/retrieval-identity-hashes.json') != ''" in gate
          mirror = next(step for step in steps if step.get('name') == 'Publish private Space results (or public mirror only with explicit production authorization)')
          assert "steps.persist-supabase.outcome == 'success'" in mirror.get('if', '')
          print('Supabase shortlist persistence requires successful scanner outcome and both output artifacts; HF mirror requires successful persistence.')

          provider_path=Path('.github/workflows/tinyfish-firecrawl-isolated.yml')
          provider=yaml.load(provider_path.read_text(encoding='utf8'),Loader=yaml.BaseLoader)
          assert 'workflow_dispatch' in provider['on']
          assert provider['concurrency']['group']=='career-radar-production-scan'
          provider_job=provider['jobs']['provider-validation']
          assert 'confirm_live_provider_requests' in provider_job.get('if', '')
          assert '== true' in provider_job.get('if', '')
          provider_steps=provider_job['steps']
          assert any(step.get('name')=='Verify TinyFish credential presence and Firecrawl quota (read-only)' for step in provider_steps)
          assert any(step.get('name')=='Upload aggregate-only provider summary' for step in provider_steps)
          print('TinyFish isolated workflow is manually gated, serialized with production, quota-preflighted and aggregate-only.')
          
          backup_path=Path('.github/workflows/backup-system-before-opportunity-expansion.yml')
          backup=yaml.load(backup_path.read_text(encoding='utf8'),Loader=yaml.BaseLoader)
          assert 'workflow_dispatch' in backup['on']
          assert 'schedule' not in backup['on'], 'System backup must remain manually controlled'
          assert backup['permissions'].get('contents') == 'read'
          backup_job=backup['jobs']['backup-database']
          assert backup_job.get('timeout-minutes') == '30'
          steps=backup_job['steps']
          names=[step.get('name','') for step in steps]
          assert 'Obtain fresh account-wide R2 Storage Guardian admission' in names
          assert 'Create full PostgreSQL logical dump and encrypt it' in names
          assert 'Upload encrypted database dump and verify R2 read-back' in names
          assert 'Upload recovery manifest and verify R2 read-back' in names
          assert 'Remove private source checkout and plaintext backup' in names
          backup_text=backup_path.read_text(encoding='utf8')
          assert 'BACKUP_ENCRYPTION_PASSPHRASE' in backup_text and 'SUPABASE_DB_URL' in backup_text
          assert not any(line.strip().startswith(('HF_TOKEN:', 'HF_SPACE_ID:')) for line in backup_text.splitlines())
          assert 'enable_production_publish' not in backup_text
          print('Encrypted full-database backup workflow is manual-only, Guardian-gated, private-R2-only and removes plaintext artifacts.')

          assessment_path=Path('.github/workflows/extension-ai-assessment.yml')
          assessment=yaml.load(assessment_path.read_text(encoding='utf8'),Loader=yaml.BaseLoader)
          dispatch=assessment['on']['workflow_dispatch']['inputs']
          assert set(dispatch)=={'run_id','source_ref'}
          assert dispatch['source_ref'].get('default')=='main'
          text=assessment_path.read_text(encoding='utf8')
          assert 'main|fix/extension-search-ranking-and-resilient-crawl' in text
          assert 'steps.scope.outputs.source_ref' in text
          assert 'EXTENSION_RUN_ID' in text
          assert 'inputs.run_id' in text
          group=assessment['concurrency']['group']
          assert 'career-radar-extension-ai-assessment-' in group and 'inputs.run_id' in group
          print('Extension assessment workflow has validated source-ref allowlist, run UUID scope, private checkout and per-run concurrency.')
          PY
      - name: Test Supabase persistence workflow gates
        run: python -m unittest discover -s tests -p 'test_production_scan_gates.py' -v
      - name: Test TinyFish and Firecrawl workflow safeguards
        run: python -m unittest discover -s tests -p 'test_tinyfish_firecrawl_workflow.py' -v

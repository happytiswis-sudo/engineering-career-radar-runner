name: Hugging Face Space to Cloudflare CORS smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/hf-space-cloudflare-cors.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-space-cloudflare-cors.yml"

permissions:
  contents: read

jobs:
  cors-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify allowed Hugging Face preflight
        shell: bash
        run: |
          set -euo pipefail
          origin="https://sidmed-engineering-career-radar.static.hf.space"
          url="https://career-radar-dashboard.happytiswis.workers.dev/api/bridge/health"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' -X OPTIONS "$url" \
            -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: content-type')"
          echo "Preflight HTTP status: $status"
          if [[ "$status" != "204" ]]; then cat "$body"; exit 1; fi
          grep -Fqi "access-control-allow-origin: $origin" "$headers"
          grep -Fqi 'access-control-allow-methods:' "$headers"
          grep -Fqi 'content-type' "$headers"
          echo "Allowed Hugging Face preflight: PASS"

      - name: Verify allowed Hugging Face health request
        shell: bash
        run: |
          set -euo pipefail
          origin="https://sidmed-engineering-career-radar.static.hf.space"
          url="https://career-radar-dashboard.happytiswis.workers.dev/api/bridge/health"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" -H "Origin: $origin")"
          echo "Health HTTP status: $status"
          if [[ "$status" != "200" ]]; then cat "$body"; exit 1; fi
          grep -Fqi "access-control-allow-origin: $origin" "$headers"
          echo "Allowed Hugging Face health request: PASS"

      - name: Verify unapproved origin is rejected
        shell: bash
        run: |
          set -euo pipefail
          url="https://career-radar-dashboard.happytiswis.workers.dev/api/bridge/health"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' -X OPTIONS "$url" \
            -H 'Origin: https://unapproved.example' \
            -H 'Access-Control-Request-Method: GET')"
          echo "Unapproved-origin preflight HTTP status: $status"
          if [[ "$status" != "403" ]]; then cat "$body"; exit 1; fi
          if grep -Fqi 'access-control-allow-origin:' "$headers"; then
            echo "::error::Unapproved origin received Access-Control-Allow-Origin"
            exit 1
          fi
          echo "Unapproved origin rejected: PASS"

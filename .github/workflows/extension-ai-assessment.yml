name: Assess complete Career Radar extension vacancies

on:
  workflow_call:
    inputs:
      run_id:
        description: Extension Search run UUID
        required: true
        type: string
      source_ref:
        description: Private source ref to execute (restricted allowlist)
        required: true
        type: string
  # Dispatched by the authenticated Career Radar Bridge after full-detail
  # checkpoints or run completion. Manual dispatch remains an operator fallback.
  workflow_dispatch:
    inputs:
      run_id:
        description: Extension Search run UUID; blank means operator-wide queue drain
        required: false
        type: string
      source_ref:
        description: Private source ref to execute (restricted allowlist)
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: career-radar-extension-ai-assessment-${{ inputs.run_id || 'manual' }}
  cancel-in-progress: false

jobs:
  assess:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name == 'pull_request' || (github.event_name == 'schedule' && vars.EXTENSION_ASSESSMENT_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate dispatch scope
        id: scope
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          case "$SOURCE_REF" in
            main|fix/extension-search-ranking-and-resilient-crawl|fix/extension-search-assessment-hardening) ;;
            *) echo "::error::source_ref is not an approved private source ref"; exit 1 ;;
          esac
          if [[ -n "$RUN_ID" && ! "$RUN_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::run_id must be a UUID"
            exit 1
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "Assessment scope validated; identifiers only."

      - name: Checkout public runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Checkout private Career Radar source and CV
        uses: actions/checkout@v4
        with:
          repository: happytiswis-sudo/engineering-career-radar
          ref: ${{ steps.scope.outputs.source_ref }}
          token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          clean: true

      - name: Validate private inputs without printing them
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          test -s private/master_cv.md
          test -s settings.json
          test -s extension_assessment.py
          echo "Private CV, settings and assessment worker are present; contents withheld."

      - name: Validate assessment credentials without displaying values
        shell: bash
        env:
          PRIVATE_SOURCE_READ_TOKEN: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
          MERCURY_API_KEY: ${{ secrets.MERCURY_API_KEY }}
          INCEPTION_MODEL: ${{ vars.INCEPTION_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_SOURCE_READ_TOKEN" || { echo "::error::PRIVATE_SOURCE_READ_TOKEN is missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          if [[ -z "$INCEPTION_API_KEY$MERCURY_API_KEY$OPENROUTER_API_KEY$NARAROUTER_API_KEY" ]]; then
            echo "::error::Configure at least one supported AI provider secret."
            exit 1
          fi
          echo "Private source, Supabase and at least one AI provider credential are configured."

      - name: Assess complete extension vacancies
        working-directory: private-source
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://plzjmyytuumxckbrrzlp.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
          MERCURY_API_KEY: ${{ secrets.MERCURY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          NARAROUTER_PROVIDER: ${{ vars.NARAROUTER_PROVIDER }}
          NARAROUTER_MODEL: ${{ vars.NARAROUTER_MODEL }}
          EXTENSION_RUN_ID: ${{ inputs.run_id }}
        run: python -u extension_assessment.py

      - name: Remove private checkout
        if: always()
        working-directory: .
        run: rm -rf private-source

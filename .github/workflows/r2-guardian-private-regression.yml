name: R2 guardian private-source regression
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  full-private-regression:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/r2-free-tier-guardian' }}
    uses: ./.github/workflows/private-scanner-regression.yml
    with:
      private_ref: feat/r2-guardian-dashboard-history
      private_base_ref: main
    secrets: inherit
